<text x="54" y="1476" font-size="11" fill="#8b93a4">Port names are the switch's own labels — it named them by hand.</text>
<rect x="872" y="812" width="808" height="678" rx="10" fill="#15171c" stroke="#333844"/>
<text x="886" y="838" font-size="15" font-weight="600" fill="#f0f2f6">CRS804 — 172.16.100.113</text>
<text x="886" y="858" font-size="11" fill="#8b93a4">spine · Marvell 98DX7335 · two bridges, one of them sacred</text>
<rect x="886" y="865" width="86" height="19" rx="4" fill="#22252d" stroke="#3a3f4c"/>
<text x="892" y="879" font-size="11.5" font-family="monospace" fill="#e6e9ef">ether1</text>
<text x="982" y="879" font-size="11.5" fill="#cdd3de">mgmt only (~1 GiB in 3 weeks) — move LAST, gated on charon being in mgmt</text>
<rect x="1627.6" y="865" width="38.4" height="19" rx="9" fill="#cfe0ff"/>
<text x="1646.8" y="879" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3b73">mgmt</text>
<text x="886" y="906" font-size="10.5" fill="#6d7688">bridge1: this one port. Nothing else on it, which is why its whole VLAN footprint is one address.</text>
<rect x="886" y="911" width="86" height="19" rx="4" fill="#22252d" stroke="#3a3f4c"/>
<text x="892" y="925" font-size="11.5" font-family="monospace" fill="#e6e9ef">ether2</text>
<text x="982" y="925" font-size="11.5" fill="#cdd3de">+ 4× QSFP-DD → the storage/RDMA fabric (192.168.0.0/24, NAS at .0.250)</text>
<rect x="1615.4" y="911" width="50.599999999999994" height="19" rx="9" fill="#c6e6f5"/>
<text x="1640.7" y="925" font-size="10.5" font-weight="600" text-anchor="middle" fill="#123a4d">fabric</text>
<text x="886" y="952" font-size="10.5" fill="#6d7688">bridge-compute: never touched — no VLAN filtering, ever. PFC/RoCE shaping lives here.</text>
<text x="886" y="974" font-size="10.5" fill="#6d7688">Its own 10.0.0.1/24 is the switch's address ON that bridge, not the fabric subnet.</text>
<text x="886" y="1476" font-size="11" fill="#8b93a4">Order: this box's management moves after charon is already in mgmt.</text>
<text x="40" y="1506" font-size="11.5" fill="#8b93a4">class chips:</text>
