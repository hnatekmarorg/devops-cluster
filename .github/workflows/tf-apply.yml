# Device IaC — apply on merge (the only path that writes to a device).
#
# Triggers only when a reviewed PR that changes terraform/** lands on main, and only when the repo
# variable ROUTEROS_CI_ENABLED is 'true' (the arming switch).
#
# ONE JOB PER DEVICE. Not a matrix, because `environment:` cannot take a matrix value — and because
# a job that calls a reusable workflow cannot carry `environment:` at all (GitHub's validator rejects
# the whole file). The environment is passed to the called workflow as an input, and that workflow
# declares it on its own job. That is also the only arrangement in which the device's write
# credential can reach the steps: an environment secret cannot be passed from the caller, because
# `on.workflow_call` has no environment keyword. The benefit is a better gate than a single switch:
# approving the router's apply says nothing about the switch's, so one merge can be applied to one
# device and declined for the other.
name: tf-apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-*.yml'
      - '.github/workflows/_apply-module.yml'
      - 'scripts/tofu-ci.sh'
  workflow_dispatch:
    inputs:
      note:
        description: 'Why this apply is being run (recorded in the run summary)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  apply-routeros:
    name: apply · routeros (RB5009)
    uses: ./.github/workflows/_apply-module.yml
    with:
      module: routeros
      host: api://172.16.100.1:8728
      state_key: routeros/rb5009.tfstate
      # Which environment gates this device. It is what the called workflow declares on the job it
      # runs, so it decides both the approval prompt and which write identity the steps get.
      environment: routeros-production
      note: ${{ inputs.note || '' }}
    # State credentials only — those are repository-scoped. The write identity is deliberately absent
    # here: it exists in the environment above and nowhere a PR-triggered job can read it.
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    # Applies are serialised per device: one writer at a time, ever.
    concurrency:
      group: tf-apply-routeros
      cancel-in-progress: false

  apply-crs326:
    name: apply · crs326 (main switch)
    uses: ./.github/workflows/_apply-module.yml
    with:
      module: crs326
      host: api://172.16.100.2:8728
      state_key: crs326/crs326.tfstate
      environment: crs326-production
      note: ${{ inputs.note || '' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    concurrency:
      group: tf-apply-crs326
      cancel-in-progress: false
