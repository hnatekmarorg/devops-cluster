# RouterOS IaC — plan on pull request (read-only gate).
#
# Runs on the on-prem, in-cluster self-hosted runner because the RouterOS API is
# reachable from the LAN only (172.16.100.1:8728, address-bound to the LAN
# subnets). A GitHub-hosted runner cannot reach it, and exposing the API to make
# that possible is not a trade this estate takes.
#
# Read-only by construction: this job uses the `agent-ro` (read policy)
# credential. The write credential (`iac`) is referenced only by tf-apply.yml,
# which runs on main after review — a pull request can never reach it.
name: tf-plan (routeros)

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-*.yml'
      - 'scripts/tofu-ci.sh'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# One plan per branch; never cancel a plan that may be holding the state lock.
concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # The runner pod reaches the internet through a proxy (ARC `proxy` values in
  # Hnatekmar/bootstrap-kubernetes); the forced-replace filter would send the
  # LAN call to the router through it and break the plan. Only the uppercase
  # form is set: the provider is Go, and Go's httpproxy checks NO_PROXY first
  # (declaring both forms makes them the same key to GitHub's env handling).
  NO_PROXY: 'localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,.svc,.cluster.local'
  ROS_HOSTURL: ${{ vars.ROS_HOSTURL || 'api://172.16.100.1:8728' }}
  TF_STATE_BACKEND: ${{ vars.TF_STATE_BACKEND || 's3' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  # Measured, not assumed: `http://minio.minio.svc.cluster.local:9000` does NOT
  # resolve from the runner (`lookup ... on 10.96.0.10:53: no such host`), so the
  # service name in Hnatekmar/bootstrap-kubernetes belongs to a different
  # cluster/generation. The TLS endpoint below is the one verified to work from
  # both the runner and a LAN host — see terraform/README.md for the trade-off
  # and the open in-cluster question.
  TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT || 'https://console-minio.hnatekmar.xyz' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'routeros/rb5009.tfstate' }}
  # MinIO advertises `europe` (x-amz-bucket-region); signing with anything else
  # risks a bucket-region mismatch error.
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'europe' }}
  # Credentials, mapped explicitly from repository secrets. This job (and the
  # drift job) gets the read identity plus the state key and nothing else: a
  # pull request can run code from a same-repo branch, so it must never be able
  # to see the write credential — that one is an environment secret on the apply
  # job only. Actions masks these values in the logs.
  ROS_READ_USERNAME: ${{ secrets.ROS_READ_USERNAME }}
  ROS_READ_PASSWORD: ${{ secrets.ROS_READ_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  plan:
    name: fmt · validate · plan
    # Fork PRs get a read-only token and would run untrusted code next to the
    # credentials — never. Same-repo branches only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: gha-runner-scale-set-hnatekmarorg

    steps:
      - uses: actions/checkout@v4

      # tofu_wrapper: false — the action's default wrapper is a Node script and
      # this runner image has no `node` on PATH (only the runner's bundled copy),
      # so the wrapper dies with "/usr/bin/env: 'node': No such file or directory".
      # Nothing here needs the wrapper: the workflows call tofu directly.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Format check
        working-directory: terraform/routeros
        run: ../../scripts/tofu-ci.sh fmt -check -recursive .

      # Everything below needs the bootstrap (RouterOS users + state store). The
      # preflight reports which piece is missing instead of failing the PR: an
      # un-armed CI must not block reviews.
      - name: Preflight — are the CI prerequisites in place?
        id: preflight
        continue-on-error: true
        working-directory: terraform/routeros
        run: ../../scripts/tofu-ci.sh --role=read check

      - name: init · validate · plan
        if: steps.preflight.outcome == 'success'
        working-directory: terraform/routeros
        run: |
          ../../scripts/tofu-ci.sh --role=read init -input=false
          ../../scripts/tofu-ci.sh validate
          ../../scripts/tofu-ci.sh --role=read plan \
            -input=false -no-color -lock-timeout=5m -out=plan.tfplan | tee plan.txt

      - name: Post the plan on the PR
        if: always() && github.event_name == 'pull_request' && steps.preflight.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PLAN_PATH: terraform/routeros/plan.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tf-plan-routeros -->';
            let plan = '';
            try { plan = fs.readFileSync(process.env.PLAN_PATH, 'utf8'); }
            catch (e) { plan = '(plan output not found — see the job log)'; }
            const limit = 55000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n… truncated — full output in the job log';
            }
            const body = [
              marker,
              '### RouterOS plan (stage 1 — additive)',
              '',
              '<details><summary>tofu plan</summary>',
              '',
              '```',
              plan.trimEnd(),
              '```',
              '',
              '</details>',
              '',
              '_Read-only: this plan was computed with the `agent-ro` (read) credential and applies nothing. Apply happens on merge via `tf-apply`._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker) && c.user.login === 'github-actions[bot]',
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Explain what the preflight found
        if: steps.preflight.outcome != 'success'
        run: |
          {
            echo "### RouterOS CI prerequisites are not in place yet — plan skipped"
            echo
            echo "The module formats and validates; only the parts needing live"
            echo "credentials/state were skipped. Missing pieces (see the preflight"
            echo "log above) are the one-time bootstrap steps listed in"
            echo "\`terraform/README.md\`:"
            echo
            echo "1. RouterOS users \`iac\` (write) and \`agent-ro\` (read) — Martin, on the RB5009"
            echo "2. The credentials reaching this runner (cluster Secret, or a sops file + age key)"
            echo "3. The state store (MinIO bucket + keys, or the \`kubernetes\` backend)"
            echo
            echo "Nothing here needs a code change — the workflow arms itself as soon"
            echo "as those exist."
          } >> "$GITHUB_STEP_SUMMARY"
