---
# RouterOS IaC — apply on merge (the only path that writes to the router).
#
# Triggers only when a reviewed PR that changes terraform/** lands on main, and
# only when the repo variable ROUTEROS_CI_ENABLED is 'true' (the arming switch:
# it stays false until the bootstrap in terraform/README.md is done, so merging
# this pipeline cannot produce a surprise apply).
#
# Uses the `iac` (read,write,test) credential. That credential exists in exactly
# two places: the router and this job's environment — never in the agent's hands,
# never in a PR job.
name: tf-apply (routeros)

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-*.yml'
      - 'scripts/tofu-ci.sh'
  workflow_dispatch:
    inputs:
      note:
        description: 'Why this apply is being run (recorded in the run summary)'
        required: false
        type: string

permissions:
  contents: read

# Applies are serialised: one writer at a time, ever.
concurrency:
  group: tf-apply-routeros
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # The runner pod egresses through a proxy; LAN traffic must bypass it or the
  # call to the router gets proxied and fails. Uppercase only — Go's httpproxy
  # checks NO_PROXY first, and both spellings are one key to GitHub's env.
  NO_PROXY: 'localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,.svc,.cluster.local'
  ROS_HOSTURL: ${{ vars.ROS_HOSTURL || 'api://172.16.100.1:8728' }}
  TF_STATE_BACKEND: ${{ vars.TF_STATE_BACKEND || 's3' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  # In-cluster service, plain HTTP — same path other clouds-native consumers in
  # this estate use (the registry cache). It avoids the public ingress, which
  # matters here: 443 is forwarded to the edge Caddy box, so
  # console-minio.hnatekmar.xyz is reachable from the internet, and the state of
  # the router should not be fetched over a publicly-advertised hostname.
  # Break-glass alternative from a LAN laptop: https://console-minio.hnatekmar.xyz
  TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT || 'http://minio.minio.svc.cluster.local:9000' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'routeros/rb5009.tfstate' }}
  # MinIO advertises `europe` (x-amz-bucket-region); signing with anything else
  # risks a bucket-region mismatch error.
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'europe' }}
  # Credentials. The write identity comes from the `routeros-production`
  # environment's secrets, so it exists only in the job you approve — never in a
  # PR-triggered job. The state key is repository-level because plan and drift
  # need it too.
  ROS_WRITE_USERNAME: ${{ secrets.ROS_WRITE_USERNAME }}
  ROS_WRITE_PASSWORD: ${{ secrets.ROS_WRITE_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  apply:
    name: plan · apply
    runs-on: gha-runner-scale-set-hnatekmarorg
    # Second gate, independent of the merge: create the environment in
    # Settings → Environments with Martin as a required reviewer. The job then
    # waits for an explicit approval before it starts.
    environment: routeros-production

    steps:
      - uses: actions/checkout@v4

      # tofu_wrapper: false — the action's default wrapper is a Node script and
      # this runner image has no `node` on PATH (only the runner's bundled copy),
      # so the wrapper dies with "/usr/bin/env: 'node': No such file or directory".
      # Nothing here needs the wrapper: the workflows call tofu directly.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Arming switch + preflight (write credential)
        id: preflight
        working-directory: terraform/routeros
        env:
          ROUTEROS_CI_ENABLED: ${{ vars.ROUTEROS_CI_ENABLED || 'false' }}
        run: |
          if [ "$ROUTEROS_CI_ENABLED" != "true" ]; then
            {
              echo "### RouterOS CI is not armed — nothing was applied"
              echo
              echo "Repository variable \`ROUTEROS_CI_ENABLED\` is not \`true\`. It is the"
              echo "switch that turns merging \`terraform/**\` into a router change; it"
              echo "stays off until the one-time bootstrap in \`terraform/README.md\` is"
              echo "complete (RouterOS \`iac\` user, credential delivery to the runner,"
              echo "state store)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::ROUTEROS_CI_ENABLED != true — apply skipped by design."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Armed: a missing credential is now a real failure, not a skip.
          ../../scripts/tofu-ci.sh --role=write check
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: init · plan · apply
        if: steps.preflight.outputs.armed == 'true'
        working-directory: terraform/routeros
        run: |
          ../../scripts/tofu-ci.sh --role=write init -input=false
          ../../scripts/tofu-ci.sh --role=write plan \
            -input=false -no-color -lock-timeout=5m -out=apply.tfplan | tee apply-plan.txt
          ../../scripts/tofu-ci.sh --role=write apply -input=false -no-color apply.tfplan | tee apply.txt

      - name: Record what changed
        if: steps.preflight.outputs.armed == 'true'
        working-directory: terraform/routeros
        run: |
          {
            echo "### RouterOS apply — $(date -u +%FT%TZ)"
            echo
            echo "Commit: \`${GITHUB_SHA}\` · run: \`${GITHUB_RUN_ID}\`"
            if [ -n "${{ inputs.note }}" ]; then echo "Note: ${{ inputs.note }}"; fi
            echo
            echo '<details><summary>plan</summary>'
            echo
            echo '```'
            tail -60 apply-plan.txt
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details><summary>apply</summary>'
            echo
            echo '```'
            tail -60 apply.txt
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details><summary>outputs (post-apply state)</summary>'
            echo
            echo '```'
            ../../scripts/tofu-ci.sh output
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the plan for the record
        if: steps.preflight.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: routeros-apply-${{ github.run_id }}
          path: |
            terraform/routeros/apply-plan.txt
            terraform/routeros/apply.txt
          retention-days: 30
