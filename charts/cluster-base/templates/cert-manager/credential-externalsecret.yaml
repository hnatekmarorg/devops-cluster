{{- if and .Values.certManager.enabled .Values.certManager.eso.enabled (eq .Values.certManager.cloudflare.secretSource "eso") }}
# The cert-issuing token, fetched from the vault. Used by every cluster EXCEPT the one that terminates
# public traffic — that one sources it via SOPS, because it cannot read from the vault it hosts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.certManager.cloudflare.secretName }}
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.certManager.eso.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.certManager.cloudflare.secretName }}
  data:
    - secretKey: {{ .Values.certManager.cloudflare.secretKey }}
      remoteRef:
        key: {{ .Values.certManager.eso.vaultPath }}
        property: api-token
{{- end }}
