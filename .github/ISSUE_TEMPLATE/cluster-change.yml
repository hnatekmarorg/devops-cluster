name: Request Cluster Change
description: Request the creation or destruction of a Kubernetes cluster.
title: "[Cluster] Create or Destroy Cluster"
body:
  - type: markdown
    attributes:
      value: |
        Provide details for the cluster operation.
  - type: input
    attributes:
      label: Cluster Name
      placeholder: "e.g. devops"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Action
      options:
        - create
        - destroy
    validations:
      required: true

  - type: textarea
    attributes:
      label: Purpose
      description: Why is this action needed?
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Prerequisites Status
      options:
        - label: Router reservations are applied.
        - label: DNS records are created.
    validations:
      required: true
