
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - chart: ingress-nginx
      repoURL: https://kubernetes.github.io/ingress-nginx
      targetRevision: 4.11.3
      helm:
        releaseName: ingress-nginx
        valuesObject:
          controller:
            allowSnippetAnnotations: true
{{- if .Values.metallb.enabled }}
            # The published VIP, PINNED rather than first-come-first-served: DNS names point at this
            # address, so an address that moves between resyncs is a DNS record that silently rots.
            # `metallb.io/loadBalancerIPs` is the annotation MetalLB reads (>= 0.14.6).
            service:
              annotations:
                metallb.io/loadBalancerIPs: {{ required "metallb.ingressVIP is required when metallb is enabled" .Values.metallb.ingressVIP | quote }}
{{- end }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nginx
  syncPolicy:
    automated: # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
      prune: true # Specifies if resources should be pruned during auto-syncing ( false by default ).
      selfHeal: true # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
      allowEmpty: false # Allows deleting all application resources during automatic syncing ( false by default ).
    syncOptions:
      - CreateNamespace=true
