# Cluster IaC — provision on merge, destroy on removal (the lifecycle).
#
# THE LIFECYCLE IS "EXISTS IN MAIN", not "has an open PR". A merge to main is the authorization to apply
# (the plan is reviewed on the PR, main is protected by required PR + approval), so the applied scope has
# to equal the reviewed scope. A PR that closes without merging provisions and destroys NOTHING.
#
#   PR adds    terraform/clusters/<name>/   -> plan on the PR        -> merge -> provision
#   PR deletes terraform/clusters/<name>/   -> plan -destroy on PR   -> merge -> destroy
#   PR closed without merging               -> nothing, at all
#
# Why not "close the PR and the cluster dies" (the review-app pattern)? Because a merge IS a close, and
# the cluster's ArgoCD wiring has to live in main for the bootstrap to find it — so merging the
# description would immediately destroy the cluster it describes. Existence in main has no such collision,
# and it gets the teardown REVIEWED as a `plan -destroy` before it runs.
name: tf-apply (clusters)

on:
  push:
    branches: [main]
    paths:
      - 'terraform/clusters/**'
      - '.github/workflows/tf-apply-cluster.yml'
      - 'scripts/tofu-ci.sh'
      - 'scripts/bootstrap-cluster.sh'
      - 'scripts/teardown-cluster.sh'
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster name (e.g. dev), or 'all' — every root in main (the reconcile pass)"
        required: true
        type: string
      action:
        description: 'What to do'
        required: true
        default: apply
        type: choice
        options: [apply, destroy]
      note:
        description: 'Why this is being run (recorded in the run summary)'
        required: false
        type: string

permissions:
  contents: write # the kubeconfig follow-up PR
  pull-requests: write
  actions: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # The arming switch — the panic button, same pattern as the device workflows: set the repository
  # variable to anything but 'true' and merges stop touching infrastructure. Read at workflow level
  # because a composite action has no `vars` context.
  CLUSTER_CI_ENABLED: ${{ vars.CLUSTER_CI_ENABLED || 'false' }}
  # LAN traffic must bypass the runner's egress proxy, or the Proxmox call gets proxied and fails.
  NO_PROXY: 'localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,.svc,.cluster.local'
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT || 'https://console-minio.hnatekmar.xyz' }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'europe' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # The Proxmox identity that creates VMs. Environment-scoped on the job below, so a pull request can
  # never reach it: repo-level it would be readable by any same-repo branch.
  PROXMOX_VE_INSECURE: ${{ vars.PROXMOX_VE_INSECURE || 'true' }}

jobs:
  # ---------------------------------------------------------------------------
  # What did this merge add, change or remove?
  # ---------------------------------------------------------------------------
  discover:
    name: which clusters
    if: vars.CLUSTER_CI_ENABLED == 'true'
    runs-on: [self-hosted, mgmt, tofu]
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has: ${{ steps.set.outputs.has }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the push diff needs the parent

      - id: set
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          IN_CLUSTER: ${{ inputs.cluster }}
          IN_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          # A dispatch names its target explicitly; a push is discovered from the diff.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$IN_CLUSTER" = "all" ]; then
              # THE RECONCILE PASS. A cluster root already in main has nothing to push, so the push
              # trigger can never build it — which is the state EVERY pre-existing cluster is in the
              # moment CI is armed. Without this, arming builds nothing until someone edits a root.
              #
              # `all` with destroy is refused on purpose: "destroy every cluster at once" is a typo away
              # from an outage and has no legitimate use here.
              if [ "$IN_ACTION" = "destroy" ]; then
                echo "::error::refusing cluster=all with action=destroy — destroy one cluster at a time"
                exit 1
              fi
              python3 - > /tmp/cluster-matrix.json <<'PY'
          import json, os
          base = 'terraform/clusters'
          roots = sorted(d for d in os.listdir(base) if os.path.isdir(os.path.join(base, d)))
          print(json.dumps({"include": [
              {"cluster": c, "action": "apply", "state_key": f"cluster-{c}/terraform.tfstate"}
              for c in roots
          ]}))
          PY
            else
              python3 - > /tmp/cluster-matrix.json <<PY
          import json
          c = "$IN_CLUSTER"
          print(json.dumps({"include": [{"cluster": c, "action": "$IN_ACTION",
                                         "state_key": f"cluster-{c}/terraform.tfstate"}]}))
          PY
            fi
            matrix="$(cat /tmp/cluster-matrix.json)"
            echo "matrix: ${matrix}"
            echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
            echo "has=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${BEFORE_SHA:-}"
          # A first push to a branch, or a force-push, reports an all-zero SHA: nothing to diff, and
          # guessing would be worse than doing nothing.
          if ! git cat-file -e "$before" 2>/dev/null; then
            echo "no usable before-SHA ('$before') — nothing to apply"
            echo "matrix={\"include\": []}" >> "$GITHUB_OUTPUT"
            echo "has=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-status -M "$before" HEAD -- terraform/clusters/ > /tmp/cluster-diff.txt || true
          echo "changed:"
          sed 's/^/  /' /tmp/cluster-diff.txt | head -20

          python3 - > /tmp/cluster-matrix.json <<'PY'
          import json

          entries = {}
          for line in open('/tmp/cluster-diff.txt'):
              parts = line.rstrip('\n').split('\t')
              if len(parts) < 2:
                  continue
              status, path = parts[0], parts[-1]  # a rename carries three fields
              bits = path.split('/')
              if len(bits) < 3 or bits[0] != 'terraform' or bits[1] != 'clusters':
                  continue
              cluster = bits[2]
              action = 'destroy' if status.startswith('D') else 'apply'
              entries[f'{cluster}:{action}'] = {
                  'cluster': cluster,
                  'action': action,
                  'state_key': f'cluster-{cluster}/terraform.tfstate',
              }

          print(json.dumps({'include': list(entries.values())}))
          PY

          matrix="$(cat /tmp/cluster-matrix.json)"
          echo "matrix: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include": []}' ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # One job per cluster, in whichever direction the merge pointed.
  # ---------------------------------------------------------------------------
  reconcile:
    name: ${{ matrix.action }} · ${{ matrix.cluster }}
    needs: discover
    if: needs.discover.outputs.has == 'true'
    # THE MATRIX — and its absence was this workflow's first real bug. The discover job produced a
    # correct two-cluster matrix, but with no strategy block the job ran ONCE with `matrix.*` undefined:
    # the name rendered as a bare "·", and every `if: matrix.action == 'apply'` was false, so the job
    # reported SUCCESS having done nothing whatsoever. A silently-empty matrix looks exactly like success,
    # which is why the fix is here and not in the discovery logic.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: [self-hosted, mgmt, tofu]
    # An apply is a writer and must not be cancelled — but it also must not hold the runner's only slot
    # forever. A fresh cluster is ~10 min of apply plus a ~1 min bootstrap; the margin covers Proxmox
    # being slow, not a hang.
    timeout-minutes: 45
    # Protected-branch only (this can only run from main) and the scope of the Proxmox write identity.
    # NOTE: one environment for all clusters. Per-cluster environments would allow approving one
    # cluster's apply without approving another's, at the cost of configuring each in the UI; if that
    # matters, rename this to `cluster-${{ matrix.cluster }}-production` and create them.
    environment: clusters-production
    # Serialised per cluster: one writer at a time, ever. Different clusters may run independently —
    # they have separate state objects — and the runner's single slot serialises them in practice.
    concurrency:
      group: tf-apply-cluster-${{ matrix.cluster }}
      cancel-in-progress: false
    env:
      TF_STATE_KEY: ${{ matrix.state_key }}
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a destroy needs the root as it was BEFORE this merge

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false # no `node` on PATH for the wrapper on this runner image

      # -----------------------------------------------------------------------
      # TOOLING — first, because BOTH paths below need it.
      # -----------------------------------------------------------------------
      # The bootstrap and the teardown drive `kubectl` (19 references) and `helm` (9), and this runner
      # image ships NEITHER — measured inside the container, not assumed. `tofu` is the one tool that IS
      # provided, by setup-opentofu. Without this the bootstrap dies inside `kubectl get --raw /healthz`,
      # whose stderr is discarded, so a missing binary reads as an unreachable API server and the step
      # sits out its whole wait budget before saying so.
      #
      # THIS MUST PRECEDE BOTH PATHS. It was ordered under the APPLY header, which meant the destroy
      # path reached `teardown-cluster.sh` before anything installed `kubectl` — the script guards its
      # own tools and refused with exit 69, so a destroy could never run. The install serves the
      # teardown exactly as much as the bootstrap; the header it sits under is not a scope.
      - name: Install the tools the runner image lacks
        if: matrix.action == 'apply' || matrix.action == 'destroy'
        run: |
          set -euo pipefail
          # Three binaries, three discoveries, one lesson: this runner image has none of them and each
          # one failed at a different point (kubectl inside a wait loop that discards stderr, helm after
          # it, bao in wire-vault). They are installed here, together, so the next missing one is a
          # non-event. Versions are pinned and deliberate:
          #   kubectl  v1.37.0  — the cluster's own version (both nodes report it), and current stable
          #   helm     v3.22.0  — the latest 3.x; the scripts are helm-3 syntax and helm 4 is a 2025
          #                       major release, not something to adopt inside a provisioning path
          #   bao      v2.6.2   — matches the on-prem OpenBao's own version
          KUBECTL_VERSION="v1.37.0"
          HELM_VERSION="v3.22.0"
          BAO_VERSION="v2.6.2"
          dest="$HOME/.local/bin"
          mkdir -p "$dest"
          curl -sfL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$dest/kubectl"
          chmod +x "$dest/kubectl"
          curl -sfL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -O linux-amd64/helm > "$dest/helm"
          chmod +x "$dest/helm"
          # The OpenBao release asset drops the 'v' from its version, hence the strip.
          curl -sfL "https://github.com/openbao/openbao/releases/download/${BAO_VERSION}/openbao_${BAO_VERSION#v}_linux_amd64.tar.gz" | tar -xz -O bao > "$dest/bao"
          chmod +x "$dest/bao"
          # $GITHUB_PATH, not a system directory: the job runs as the unprivileged `runner` user.
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/kubectl" version --client
          "$dest/helm" version --short
          "$dest/bao" version

      # THE WHOLE LIST, IN ONE PLACE. Every missing binary so far was found the hard way — a failed run
      # each — because they fail at different points, some inside loops that discard stderr. This names
      # them all before anything touches a cluster, so the next gap costs one step, not one evening.
      - name: Verify every tool this job needs is on PATH
        if: matrix.action == 'apply' || matrix.action == 'destroy'
        run: |
          set -euo pipefail
          # tofu comes from setup-opentofu; the rest from the step above or the base image. jq, curl, git,
          # python3 and coreutils are present in the image — verified, not assumed.
          missing=""
          for t in tofu kubectl helm bao curl git python3 jq base64 stat mktemp tar; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing from PATH:$missing"
            exit 1
          fi
          echo "all present: $(for t in tofu kubectl helm bao jq curl git python3; do printf '%s ' "$t"; done)"

      # -----------------------------------------------------------------------
      # DESTROY — the root may be gone from this commit, so restore it first if it is.
      # -----------------------------------------------------------------------
      - name: Restore the root as it was before the removal
        if: matrix.action == 'destroy'
        run: |
          set -euo pipefail
          root="terraform/clusters/${{ matrix.cluster }}"

          # TWO WAYS IN, and only one of them has a root to restore. A dispatch names a cluster that is
          # still in main — the config is right there in the worktree, so there is nothing to restore and
          # this step is a no-op. A push that REMOVED the root leaves it absent from HEAD, and that is the
          # case the checkout below exists for. Deriving which one this is from the event and not from the
          # filesystem is what broke the dispatch path: `github.event.before` is absent on
          # workflow_dispatch, so `before` was empty, `git cat-file -e ""` failed, and the job died with
          # "cannot determine the previous commit" before `tofu` ever ran.
          if [ -d "$root" ]; then
            echo "$root is present in this commit — nothing to restore"
            exit 0
          fi

          # `tofu destroy` needs the CONFIGURATION, not just the state: the state says what exists, the
          # config says what to do about it. The removal was a merge, so the config comes from its parent.
          # Without this the job would fail with "no such directory" and leave the VMs up.
          before="${{ github.event.before }}"
          if git cat-file -e "$before" 2>/dev/null; then
            git checkout "$before" -- "$root"
            echo "restored ${root} from ${before}"
          else
            echo "::error::${root} is absent from HEAD and the previous commit ('${before}') is unusable — restore the root by hand before destroying"
            exit 1
          fi

      - name: Teardown — drain, destroy, sweep
        if: matrix.action == 'destroy'
        run: ./scripts/teardown-cluster.sh "${{ matrix.cluster }}" --yes
        env:
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}

      # -----------------------------------------------------------------------
      # APPLY
      # -----------------------------------------------------------------------

      - name: Preflight
        if: matrix.action == 'apply'
        id: preflight
        working-directory: terraform/clusters/${{ matrix.cluster }}
        run: ../../../scripts/tofu-ci.sh --role=none check

      - name: init · apply
        if: matrix.action == 'apply'
        working-directory: terraform/clusters/${{ matrix.cluster }}
        run: |
          set -o pipefail
          ../../../scripts/tofu-ci.sh --role=none init -input=false
          # An apply TAKES the state lock (unlike a plan): writers are serialised, and that is what
          # `concurrency` above and `tf-unlock` exist to keep honest.
          ../../../scripts/tofu-ci.sh --role=none apply -input=false -auto-approve | tee apply.txt

      # The bootstrap runs on every apply rather than only on creation: it is idempotent, and running it
      # after a REBUILD is what restores the CCM, the CRDs, the join secret and the root Application in
      # the one order that works. Skipping it on "the cluster already existed" is how a rebuilt cluster
      # ends up with a stale CA and a join secret from the previous generation.
      - name: Bootstrap — CCM, CRDs, ArgoCD, join secret
        if: matrix.action == 'apply'
        run: |
          # `set -o pipefail`: without it `| tee` reports TEE's status, and the bootstrap failing at
          # "API server never came up" produced a green step with a cluster that was never bootstrapped.
          # Every piped step in this job needs this line, not just the ones with obvious failure modes.
          set -o pipefail
          ./scripts/bootstrap-cluster.sh "${{ matrix.cluster }}" 2>&1 | tee bootstrap.txt

      # ESO's ClusterSecretStore cannot authenticate until the vault knows THIS cluster: the
      # `auth/kubernetes-<cluster>` mount holds the cluster's CA and a TokenReview credential, and both
      # change on every rebuild. Without this step a freshly built cluster converges with cluster-base
      # reporting `InvalidProviderConfig` — the failure I hit by hand the first time, and the reason
      # wire-vault.sh exists. It must run AFTER the bootstrap and BEFORE anything expects a secret.
      #
      # No new CI secret: BAO_TOKEN wins when set, otherwise the script reads /etc/bao_token, which is
      # where the runner keeps it (mode 0600) and where the `bao` CLI is already installed.
      - name: Wire the vault to this cluster
        if: matrix.action == 'apply'
        run: |
          set -o pipefail   # same reason as the bootstrap: a failed wire-vault also looked green
          ./scripts/wire-vault.sh "${{ matrix.cluster }}" 2>&1 | tee vault.txt
        env:
          # EITHER a repository/environment secret, OR a file the CONTAINER can read — note that
          # /etc/bao_token on the runner HOST is not visible inside the runner container, which is where
          # this runs. wire-vault.sh falls back to /etc/bao_token only if that path exists in-container.
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}

      - name: Post-apply summary + the kubeconfig
        if: matrix.action == 'apply'
        # The PR step calls the REST API directly; without this the shell reports
        # "GITHUB_TOKEN: unbound variable" inside a command substitution, where `|| true` swallowed it —
        # so the kubeconfig PR silently never opened.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cluster="${{ matrix.cluster }}"
          {
            echo "## cluster \`${cluster}\` reconciled"
            echo
            echo "### bootstrap"
            echo '```'
            tail -40 bootstrap.txt 2>/dev/null || echo "(no bootstrap output)"
            echo '```'
            echo
            echo "### vault"
            echo '```'
            tail -12 vault.txt 2>/dev/null || echo "(no vault output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The credential-free kubeconfig: endpoint, PUBLIC CA, and a kubelogin exec block. Safe to show
          # — the identity lives in Keycloak — and it is the thing you actually need after a rebuild,
          # because the CA changes and a stale file fails with a bare x509 error.
          if ./scripts/kubeconfig.sh "$cluster" >/dev/null 2>&1; then
            {
              echo "### SSO kubeconfig"
              echo
              echo '```yaml'
              cat "terraform/clusters/${cluster}/kubeconfig.yaml"
              echo '```'
              echo
              echo "Use it with the \`kubelogin\` plugin; the first call opens a browser for Keycloak SSO."
            } >> "$GITHUB_STEP_SUMMARY"

            # `git status --porcelain`, NOT `git diff --quiet`. For a cluster whose kubeconfig is not in
            # git yet — every newly declared cluster — `git diff` reports no change (untracked files are
            # invisible to it, measured) and this PR would never open. Porcelain reports both `??` and
            # ` M`, so a first build and a rebuild are handled by the same check.
            if [ -n "$(git status --porcelain -- "terraform/clusters/${cluster}/kubeconfig.yaml")" ]; then
              # The committed copy is now stale — after a rebuild the CA differs, and a stale file is
              # worse than no file. Open a PR rather than committing to main: main is reviewed, and CI
              # writing to it would quietly break that.
              branch="bot/kubeconfig-${cluster}-$(date -u +%Y%m%d%H%M%S)"
              git config user.name 'github-actions[bot]'
              git config user.email 'github-actions[bot]@users.noreply.github.com'
              git checkout -b "$branch"
              git add "terraform/clusters/${cluster}/kubeconfig.yaml"
              git commit -q -m "chore(${cluster}): refresh the OIDC kubeconfig — the CA changed with the rebuild"
              git push -q origin "$branch"
              # GITHUB_TOKEN-created PRs do not trigger other workflows, so the kubeconfig goes into the
              # PR BODY here rather than being left to kubeconfig-comment.yml, which will never fire for
              # this PR. Either way, whoever reviews it has the kubeconfig in front of them.
              api="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}"
              body="$(python3 - "$cluster" "$branch" <<'PY'
          import json, os, sys
          cluster, branch = sys.argv[1], sys.argv[2]
          kc = open(f"terraform/clusters/{cluster}/kubeconfig.yaml").read()
          pr_body = (
              f"A rebuild of `{cluster}` produced a new CA, so the committed kubeconfig no longer "
              "verifies against the cluster. Merging this keeps git truthful.\n\n"
              f"<details><summary>kubeconfig</summary>\n\n```yaml\n{kc}\n```\n\n</details>\n"
          )
          print(json.dumps({
              "title": f"chore({cluster}): refresh the OIDC kubeconfig",
              "head": branch,
              "base": "main",
              "body": pr_body,
          }))
          PY
          )"
              pr_url="$(curl -sf -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'Accept: application/vnd.github+json' -d "$body" "${api}/pulls" | \
                python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url",""))' || true)"
              {
                echo
                echo "### kubeconfig PR"
                echo
                echo "The committed copy was stale; a PR was opened: ${pr_url:-<failed to open — commit it by hand>}"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The committed kubeconfig still matches — nothing to update." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::could not regenerate the kubeconfig (is the state reachable?)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Explain a skipped preflight
        if: matrix.action == 'apply' && steps.preflight.outcome != 'success'
        working-directory: terraform/clusters/${{ matrix.cluster }}
        run: |
          {
            echo "### cluster \`${{ matrix.cluster }}\`: prerequisites missing — nothing applied"
            echo
            echo "Nothing was created or destroyed. The preflight above reports which piece is missing:"
            echo
            echo "1. The state backend — \`TF_STATE_BUCKET\` / \`TF_STATE_ENDPOINT\` repository variables, plus the \`AWS_*\` state credentials"
            echo "2. The Proxmox identity — \`PROXMOX_VE_ENDPOINT\` and \`PROXMOX_VE_API_TOKEN\` **on the \`clusters-production\` environment**"
            echo
            echo "Nothing here needs a code change — the apply arms itself as soon as those exist."
          } >> "$GITHUB_STEP_SUMMARY"
