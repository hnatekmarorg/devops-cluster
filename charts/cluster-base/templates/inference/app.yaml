{{- if and .Values.onprem .Values.inference.enabled }}
{{/*
The model zoo (charts/llama-cpp): one Deployment per model, toggled by SCALE. The model set is
per-cluster data — `inference.values` in this cluster's cluster-base.yaml is passed to the chart
verbatim (see charts/llama-cpp/values.yaml for the schema).
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hnatekmarorg/devops-cluster.git
    targetRevision: HEAD
    path: charts/llama-cpp
    helm:
      valuesObject:
{{ toYaml .Values.inference.values | indent 8 }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: inference
  # SCALE owns /spec/replicas — that IS the product. Without this the controller reverts
  # every toggle on its next reconcile (measured 2026-10-11: argocd-controller re-applied
  # replicas=0 the same second SCALE set 1). `RespectIgnoreDifferences` is already in the
  # syncOptions, so syncs honour it too.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
{{- end }}
