# The Forgejo Actions runner on DEV — the in-cluster half of the forge's capacity.
#
# RELATIONSHIP TO THE DEDICATED HOST — settled by the purpose-label scheme (2026-10-11): labels name
# what a runner IS, not where it sits. `mgmt` = the dedicated mgmt host (device workflows — "CI must
# not live in the cluster it manages", a technical fact now: those workflows match only a runner that
# carries mgmt). `dind` = docker builders — this one, moved here from prod (2026-10-12): builds are
# bursty and the dind is privileged, so they belong on the cluster that MAY be rebuilt, not on the
# one that must survive. `k8s` = kubernetes runners (reserved; lands when a workflow needs it). This
# runner therefore carries `self-hosted, dind` and nothing else.
#
# WHY IT IS NOT THE pet HOST: the estate's GitHub runners live on a dedicated `mgmt` host because the
# device-touching jobs need a toolchain no container image has. This runner is the counter-example:
# it is one pod, it registers ONCE (a token, not an hourly expiry), and `runs-on` labels are free-form.
#
# THE ONE TRAP, measured the hard way: a job's `runs-on` is matched against the labels recorded at
# REGISTRATION (`action_runner.agent_labels`), not against the labels in `config.yaml`. `register`
# silently DROPS any label that `config.yaml` does not define an image for — so a label defined in only
# one of the two places produces a job that queues forever with no error anywhere. Both lists below must
# stay in step, and changing either means re-registering the runner (delete `/data/.runner` and restart).
---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
  labels:
    # DinD is privileged because the runner starts job containers next to itself through a docker
    # daemon. That is the design, not an accident, so the namespace says so instead of fighting PSA.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
---
# The label -> image map. `node:22-bookworm` is the job image: it carries node 22, python3, curl, git,
# tar and unzip. It does NOT carry jq, kubectl, aws, tofu, gh, sops, age or zstd — the workflows
# install what they need. A ConfigMap, not a Secret: nothing in it is secret; the runner's identity
# lives in the `.runner` file registration writes into `/data`, and the registration token comes from
# the `runner-registration` Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: act-runner-config
  namespace: forgejo-runner
data:
  config.yaml: |
    log:
      level: info
    runner:
      # ONE slot. The runner polls with this capacity and the server will not hand it more jobs than it
      # accepts; 1 keeps job ordering predictable in a small cluster. Raise it only with the runner's
      # memory in mind — each concurrent job is another container.
      capacity: 1
      timeout: 30m
      # MUST match the --labels list in the Deployment's register command, and MUST list every label
      # the workflows ask for. See the trap note at the top of this file.
      labels:
        - "self-hosted:docker://node:22-bookworm"
        - "dind:docker://node:22-bookworm"
    cache:
      enabled: true
      dir: /data/cache
    container:
      # host.docker.internal inside a job container resolves to the host gateway, so a job that needs
      # to reach something on the pod's network does not need to know the pod's IP.
      options: "--add-host=host.docker.internal:host-gateway"
    host:
      workdir_parent: /data/work
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: act-runner-data
  namespace: forgejo-runner
spec:
  accessModes: [ReadWriteOnce]
  # The block tier, per the estate's state-volume rule: `/data` holds only the registration (`.runner`),
  # the persisted work tree and the action cache — small, and the only thing that must outlive a pod is
  # `.runner`.
  storageClassName: truenas-nvmeof
  resources:
    requests:
      storage: 5Gi
---
# The dind layer cache. Measured on a Talos worker (2026-10-11): with an emptyDir this cache lands on
# the NODE's ephemeral disk (28.9G total) — a busy CI fills the node. The block tier: sparse and
# expandable. Unlike the runner's /data this is pure cache — losing it costs rebuild time, nothing else.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: act-runner-dind
  namespace: forgejo-runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-nvmeof
  resources:
    requests:
      storage: 32Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: act-runner
  template:
    metadata:
      labels:
        app: act-runner
      annotations:
        # karpenter: never voluntarily disrupt this node while a runner lives on it — a drain
        # (drift, or a future consolidation-policy change) would kill a job mid-run. To recycle a
        # node this blocks, bounce the runner pod; it re-registers from its PVC.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      # The PVCs come up root-owned; the runner is non-root. fsGroup gives the volume group access
      # (and adds the group to the containers), so `.runner` can be written. Do NOT set runAsUser
      # pod-wide: the dind needs root (without it dockerd falls to rootless mode and dies on the
      # missing rootlesskit). Both measured live on prod, 2026-10-11.
      securityContext:
        fsGroup: 1000
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until nc -z 127.0.0.1 2375; do echo waiting-for-dind; sleep 2; done
              cd /data
              if [ ! -f /data/.runner ]; then
                # `-c` matters: without it the register does not see the label->image map above and
                # records the bare names, which run jobs in :host mode (on the pod's filesystem)
                # instead of the job containers. Measured on the ZimaBoard, same runner version.
                /bin/forgejo-runner register --no-interactive -c /config/config.yaml \
                  --instance "$GITEA_INSTANCE_URL" --token "$RUNNER_REG_TOKEN" \
                  --name dev-dind --labels "self-hosted,dind"
              fi
              exec /bin/forgejo-runner daemon --config /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            # The runner does not use this, but the SERVER sends the actions URL with every task, so
            # this is the belt to the server-side `[actions] DEFAULT_ACTIONS_URL` braces.
            - name: DEFAULT_ACTIONS_URL
              value: https://github.com
            - name: GITEA_INSTANCE_URL
              value: https://forgejo.srv.hnatekmar.dev
            - name: RUNNER_REG_TOKEN
              valueFrom:
                secretKeyRef:
                  # Minted server-side with `forgejo forgejo-cli actions generate-runner-token
                  # --scope <org>` and valid until the runner registers; the `.runner` file it writes
                  # is the long-lived identity. PREREQUISITE: Secret `runner-registration`.
                  name: runner-registration
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
        # DinD: the job containers are started by a docker daemon that lives beside the runner. The 2Gi
        # limit is the honest constraint of this design — a heavy job image pull is what it bounds, and
        # the runner's single slot is what keeps that from happening twice at once.
        - name: dind
          image: docker:27-dind
          args: ["dockerd", "--host=tcp://127.0.0.1:2375", "--tls=false"]
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""              # plain TCP on the loopback of a shared pod network; no TLS to negotiate
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: config
          configMap:
            name: act-runner-config
        - name: data
          persistentVolumeClaim:
            claimName: act-runner-data
        - name: dind-storage
          persistentVolumeClaim:
            claimName: act-runner-dind

---
# The general CI lane (`k8s`) — lints, tests, templating: everything that needs a runner but neither
# the devices (`mgmt`) nor the build cache (`dind`). It still carries a dind sidecar, because job
# containers need a daemon; the 10Gi cache keeps the job image warm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-runner-config
  namespace: forgejo-runner
data:
  config.yaml: |
    log:
      level: info
    runner:
      capacity: 1
      timeout: 30m
      labels:
        - "self-hosted:docker://node:22-bookworm"
        - "k8s:docker://node:22-bookworm"
    cache:
      enabled: true
      dir: /data/cache
    container:
      options: "--add-host=host.docker.internal:host-gateway"
    host:
      workdir_parent: /data/work
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-runner-data
  namespace: forgejo-runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-nvmeof
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-runner-dind
  namespace: forgejo-runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-nvmeof
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
      annotations:
        # karpenter: never voluntarily disrupt this node while a runner lives on it — a drain
        # (drift, or a future consolidation-policy change) would kill a job mid-run. To recycle a
        # node this blocks, bounce the runner pod; it re-registers from its PVC.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until nc -z 127.0.0.1 2375; do echo waiting-for-dind; sleep 2; done
              cd /data
              if [ ! -f /data/.runner ]; then
                /bin/forgejo-runner register --no-interactive -c /config/config.yaml \
                  --instance "$GITEA_INSTANCE_URL" --token "$RUNNER_REG_TOKEN" \
                  --name dev-k8s --labels "self-hosted,k8s"
              fi
              exec /bin/forgejo-runner daemon --config /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            - name: DEFAULT_ACTIONS_URL
              value: https://github.com
            - name: GITEA_INSTANCE_URL
              value: https://forgejo.srv.hnatekmar.dev
            - name: RUNNER_REG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-runner-registration
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
        - name: dind
          image: docker:27-dind
          # 0.0.0.0, not loopback: job containers reach the daemon through host.docker.internal
          # (the pod's docker0 gateway) — see the note in 20-runner.yaml.
          args: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false"]
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: config
          configMap:
            name: ci-runner-config
        - name: data
          persistentVolumeClaim:
            claimName: ci-runner-data
        - name: dind-storage
          persistentVolumeClaim:
            claimName: ci-runner-dind
