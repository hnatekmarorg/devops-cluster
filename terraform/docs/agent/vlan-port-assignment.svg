<text x="150" y="321" font-size="11.5" fill="#cdd3de">172.16.101.1/24, no link — vestigial work experiment, cleanup</text>
<rect x="789.5" y="307" width="44.5" height="19" rx="9" fill="#8a8a8a"/>
<text x="811.75" y="321" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2b2b2b">spare</text>
<text x="54" y="348" font-size="10.5" fill="#6d7688">bridge: defconf, every port pvid 1, vlan-filtering off, no VLAN entries</text>
<text x="54" y="774" font-size="11" fill="#8b93a4">ISP → ether5 is measured, not assumed: 24.76 MiB in while ether4 pushed 24.64 MiB out.</text>
<rect x="872" y="110" width="808" height="678" rx="10" fill="#15171c" stroke="#333844"/>
