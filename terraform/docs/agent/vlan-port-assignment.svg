<text x="150" y="225" font-size="11.5" fill="#cdd3de">→ CRS326 ether18 — LAN uplink, 1 Gb (measured by counters)</text>
<rect x="789.5" y="211" width="44.5" height="19" rx="9" fill="#e0e0e0"/>
<text x="811.75" y="225" font-size="10.5" font-weight="600" text-anchor="middle" fill="#4a4a4a">trunk</text>
