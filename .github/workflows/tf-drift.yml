# RouterOS IaC — nightly drift detection (the safety net that makes "IaC-managed"
# honest: anything changed on the device by hand shows up here as a plan that
# wants to undo it).
#
# Read-only (`agent-ro`) and independent of the apply path. Gated by the same
# ROUTEROS_CI_ENABLED arming switch, so a not-yet-bootstrapped pipeline does not
# produce a nightly red X.
#
# Exit codes of `tofu plan -detailed-exitcode`:
#   0 = the device matches the repo    → close the tracking issue if open
#   2 = drift                          → open/update the tracking issue with the diff
#   1 = the plan itself failed         → open/update the issue with the failure
name: tf-drift (routeros)

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC nightly — the estate is idle
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tf-drift-routeros
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  NO_PROXY: 'localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,.svc,.cluster.local'
  ROS_HOSTURL: ${{ vars.ROS_HOSTURL || 'api://172.16.100.1:8728' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  # Measured, not assumed: `http://minio.minio.svc.cluster.local:9000` does NOT
  # resolve from the runner (`lookup ... on 10.96.0.10:53: no such host`), so the
  # service name in Hnatekmar/bootstrap-kubernetes belongs to a different
  # cluster/generation. The TLS endpoint below is the one verified to work from
  # both the runner and a LAN host — see terraform/README.md for the trade-off
  # and the open in-cluster question.
  TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT || 'https://console-minio.hnatekmar.xyz' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'routeros/rb5009.tfstate' }}
  # MinIO advertises `europe` (x-amz-bucket-region); signing with anything else
  # risks a bucket-region mismatch error.
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'europe' }}
  # Credentials, mapped explicitly from repository secrets. This job (and the
  # drift job) gets the read identity plus the state key and nothing else: a
  # pull request can run code from a same-repo branch, so it must never be able
  # to see the write credential — that one is an environment secret on the apply
  # job only. Actions masks these values in the logs.
  ROS_READ_USERNAME: ${{ secrets.ROS_READ_USERNAME }}
  ROS_READ_PASSWORD: ${{ secrets.ROS_READ_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  drift:
    name: nightly plan
    # STAYS ON ARC for now: this workflow touches the RB5009, and the mgmt runner cannot complete a
    # RouterOS API login against it (`could not login: EOF`, and the router logs no attempt at all).
    # The same runner logs in to the CRS326 fine, so it is device-specific and unsolved — see
    # terraform/docs/ci-runner.md. Move this line when the fault is understood.
    runs-on: gha-runner-scale-set-hnatekmarorg

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: routeros
            host: api://172.16.100.1:8728
            state_key: routeros/rb5009.tfstate
            environment: routeros-production
          - module: crs326
            host: api://172.16.100.2:8728
            state_key: crs326/crs326.tfstate
            environment: crs326-production
    # Per-module overrides of the workflow-level env: one device per matrix entry, one state file
    # each, and (for apply) one environment each — which is what makes a per-device approval gate
    # possible: approving the router's apply says nothing about the switch's.
    env:
      ROS_HOSTURL: ${{ matrix.host }}
      TF_STATE_KEY: ${{ matrix.state_key }}
    steps:
      - uses: actions/checkout@v4

      # tofu_wrapper: false — the action's default wrapper is a Node script and
      # this runner image has no `node` on PATH (only the runner's bundled copy),
      # so the wrapper dies with "/usr/bin/env: 'node': No such file or directory".
      # Nothing here needs the wrapper: the workflows call tofu directly.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Arming switch + preflight (read credential)
        id: preflight
        working-directory: terraform/${{ matrix.module }}
        env:
          ROUTEROS_CI_ENABLED: ${{ vars.ROUTEROS_CI_ENABLED || 'false' }}
        run: |
          if [ "$ROUTEROS_CI_ENABLED" != "true" ]; then
            echo "::notice::ROUTEROS_CI_ENABLED != true — drift check skipped by design."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ../../scripts/tofu-ci.sh --role=read check
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: init + is there a baseline to watch yet?
        id: baseline
        if: steps.preflight.outputs.armed == 'true'
        working-directory: terraform/${{ matrix.module }}
        run: |
          ../../scripts/tofu-ci.sh --role=read init -input=false
          # Until stage 1 has been applied once, `tofu plan` is non-empty by
          # definition (20 objects to create). Reporting that as "drift" every
          # night would be noise, and worse, it would train us to ignore the
          # issue. Drift means *the device disagrees with state*, so state has to
          # exist first.
          object_count=$(../../scripts/tofu-ci.sh state list 2>/dev/null | grep -c . || true)
          echo "objects in state: ${object_count}"
          if [ "$object_count" -eq 0 ]; then
            echo "::notice::No state yet — the repository has not been applied, so there is nothing to drift from. Skipping the drift comparison (this is the pre-baseline case, not drift)."
            echo "baseline=false" >> "$GITHUB_OUTPUT"
          else
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          fi

      - name: plan -detailed-exitcode
        id: drift
        if: steps.preflight.outputs.armed == 'true' && steps.baseline.outputs.baseline == 'true'
        working-directory: terraform/${{ matrix.module }}
        run: |
          set +e
          ../../scripts/tofu-ci.sh --role=read plan \
            -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=drift.tfplan \
            > drift.txt 2>&1
          code=$?
          set -e
          case "$code" in
            0) echo "No drift: the device matches the repository." ;;
            2)
              # exit 2 means "changes", but this module's *outputs* are read from the device, so
              # they shift whenever anything on the router changes — including our own applies and
              # any hand-change. Only a change to a RESOURCE is drift, and a plan with resource
              # changes always prints a "Plan: N to …" summary line; an outputs-only diff does not.
              # Getting this wrong would open a drift issue every night until the alert meant nothing.
              if grep -qE "^Plan: [0-9]+ to" drift.txt; then
                echo "Drift detected: something on the device differs from the repository."
              else
                echo "::notice::plan reported changes in outputs only (outputs are read from the device) — not drift."
                code=0
              fi
              ;;
            *) echo "The drift plan failed (exit $code)."; grep -avE "MikrotikResourceDataToTerraform|^Warning: Field |^Schema development: |^\(and [0-9]+ more" drift.txt | tail -40 ;;
          esac
          # The provider reports fields it does not model yet (trusted_ra, trusted_dhcpv6, managed…)
          # as multi-line warnings. Known-benign, and they bury the actual diff.
          grep -avE "MikrotikResourceDataToTerraform|^Warning: Field |^Schema development: |^\(and [0-9]+ more|^$" drift.txt > drift-filtered.txt || true
          mv drift-filtered.txt drift.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          echo "--- drift report ---"
          tail -40 drift.txt
          exit 0   # the reporting step decides what the outcome means

      - name: Report drift
        if: steps.preflight.outputs.armed == 'true' && steps.baseline.outputs.baseline == 'true'
        uses: actions/github-script@v7
        env:
          DRIFT_EXIT: ${{ steps.drift.outputs.exitcode }}
          DRIFT_PATH: terraform/${{ matrix.module }}/drift.txt
          MODULE: ${{ matrix.module }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- ${process.env.MODULE}-drift -->`;
            const title = `${process.env.MODULE} drift detected`;
            const code = process.env.DRIFT_EXIT;
            let out = '';
            try { out = fs.readFileSync(process.env.DRIFT_PATH, 'utf8'); } catch (e) { out = '(no plan output captured)'; }
            if (out.length > 50000) out = out.slice(0, 50000) + '\n… truncated';

            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = open.find((i) => i.body && i.body.includes(marker));

            if (code === '0') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `${marker}\nBack in sync as of ${new Date().toISOString()} — \`tofu plan\` is empty. Closing.`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              } else {
                console.log('No drift, no issue to close.');
              }
              return;
            }

            const heading = code === '2'
              ? 'The RB5009 differs from what `terraform/routeros` declares.'
              : `The drift plan could not be computed (exit ${code}) — this is a pipeline failure, not a router change.`;
            const body = [
              marker,
              `### ${heading}`,
              '',
              `Detected: ${new Date().toISOString()} · workflow run [${context.runId}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
              '',
              'Per the change-control rules this gets **codified the same day**: either the',
              'change was legitimate (then it comes back as a reviewed PR) or it is reverted.',
              '',
              '<details><summary>tofu plan</summary>',
              '',
              '```',
              out.trimEnd(),
              '```',
              '',
              '</details>',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              console.log(`Updated issue #${existing.number}`);
            } else {
              console.log('Opening the drift issue.');
              const issue = { owner, repo, title, body, labels: ['routeros-drift'] };
              try {
                await github.rest.issues.create(issue);
              } catch (e) {
                // The label may not exist yet in this repository.
                delete issue.labels;
                await github.rest.issues.create(issue);
              }
            }
