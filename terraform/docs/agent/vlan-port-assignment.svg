<text x="150" y="201" font-size="11.5" fill="#cdd3de">holds 172.16.100.1/24 as a bridge slave, link down — move first</text>
<rect x="795.6" y="187" width="38.4" height="19" rx="9" fill="#cfe0ff"/>
<text x="814.8" y="201" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3b73">mgmt</text>
