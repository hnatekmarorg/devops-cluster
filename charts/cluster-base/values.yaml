# If it is onprem cluster chart deploys additional things such as storage solutions
onprem: true
# TLS issuance for cluster ingresses. The credential's SOURCE depends on the cluster's role:
#   - the cluster that terminates public traffic (the bootstrap / "reverse proxy" cluster) must use
#     `sops`: it cannot fetch a cert-issuing token from the vault it itself hosts. It opts into the
#     operator with `sops.enabled: true` (below) and sets `cloudflare.secretSource: sops`.
#   - every other cluster uses the default `eso`, pointing at the vault in its own site.
# The created Secret's NAME and KEY are identical either way, so the ClusterIssuer never changes.
certManager:
  enabled: true
  email: m.hnatma@gmail.com
  cloudflare:
    secretSource: eso               # sops | eso
    secretName: cloudflare-api-token-secret
    secretKey: api-token
  # The secretName above must already exist, created one of two ways:
  #   sops → a SopsSecret in this cluster's own config tree (per-repo ciphertext), e.g.
  #          devops/argocd/secrets/enc.cloudflare.yaml, decrypted by the sops-secrets-operator
  #   eso  → ExternalSecret below, reading from the vault in this cluster's site
  eso:
    enabled: true                   # true when secretSource is eso (the default)
    # The vault auth mount for THIS cluster: must match auth/kubernetes-<clusterName> as enabled by
    # scripts/wire-vault.sh. Not shareable — the mount holds one CA and one reviewer token, and a
    # rebuilt cluster has a new CA.
    mountPath: ""
    storeName: local
    storeServer: https://bao.srv.hnatekmar.dev     # home clusters; hetzner uses bao.hnatekmar.xyz
    vaultPath: hermes/data/cloudflare-api   # the KV MOUNT (ClusterSecretStore path)
    # The path INSIDE the mount. Must fall under this cluster's prefix — the vault policy grants
    # secret/<cluster>/* only. Empty derives <clusterName>/cloudflare.
    vaultKey: ""
    vaultRole: ""

# The sops-secrets-operator, which decrypts SopsSecrets in-cluster (per-repo ciphertext, see
# https://github.com/isindir/sops-secrets-operator). Off by default: the default credential route is
# ESO above. The reverse-proxy cluster — which cannot read the vault it hosts — enables this and
# switches certManager.cloudflare.secretSource back to sops.
sops:
  enabled: false

# The autoscaling idiom — see terraform/docs/cluster-autoscaling.md.
# Proxmox-specific, so gated on `onprem` above.
karpenter:
  enabled: true
  # Must match the `region` in the Proxmox credentials config used by BOTH provider and CCM.
  region: balteus

  # What every pool inherits. A pool overrides per key; nothing here is per-cluster beyond these defaults.
  defaults:
    bootDevice:
      # The node's own disk. The provider attaches its own cloud-init CD-ROM, so the template does not
      # need one — and a template with a cloud-init drive on a SECOND storage fails with
      # `Multiple storage IDs found for template`.
      size: 30G
      # This storage ALSO selects the zones: the provider derives them from it and counts only zones that
      # can see the template. The wrong one yields `TemplatesNotFound`, which reads like a template-name
      # problem and is not one. NOTE for a second PVE host: `iscsi` is an LVM over one iSCSI LUN and
      # reports shared=0, so the template AND this storage must exist under the same names on every node
      # a clone may land on — see terraform/docs/cluster-autoscaling.md.
      storage: iscsi
    # Karpenter's own grid: c1=1:2 t1=1:3 s1=1:4 m1=1:8 x1=1:16, N ∈ {1,2,4,8,16}. The instance type IS
    # the node size (m1.4VCPU-32GB → 4 cores / 32 GiB). Adding a family only widens what may be chosen.
    instanceFamilies: ["c1", "t1", "s1"]
    # A BUDGET, not the machine's size. The provider does not overcommit memory and Proxmox reserves
    # nothing, so a limit near the host's capacity lets a pool race every other VM on the box —
    # measured on balteus 2026-09-19: 128 cores / 1008 GiB total with ~447 GiB already held by 51 VMs
    # (the NAS VM alone holds 256 GiB). Clusters that want more state it themselves; see the two
    # Applications under bootstrap/argocd/.
    limits:
      cpu: "8"
      memory: 32Gi
    disruption:
      # WhenEmpty + a short consolidateAfter is what turns an idle burst node back into free RAM; the
      # provider will not stop a node that still has pods.
      consolidationPolicy: WhenEmpty
      consolidateAfter: 1m
    expireAfter: Never

  # THE POOLS. Each entry renders a ProxmoxNodeClass + a NodePool; the ProxmoxUnmanagedTemplate is
  # rendered once per distinct templateName. Adding a pool — CPU, memory-optimised, GPU — is a values
  # change, not a template change.
  #
  # A GPU pool needs more than values: a PVE PCI resource mapping (PVE takes the FIRST FREE device from
  # the mapping at VM start, which is how two nodes hold two different cards) plus the NVIDIA extensions
  # in the node image. Neither exists yet — see the doc before adding one.
  pools:
    - name: talos-nocloud-template
      # The NAME of the PVE template to clone, searched on every Proxmox node. It must carry the class
      # VLAN tag on net0, the storage bridge on net1 and cpu=x86-64-v2-AES, and it must be big enough to
      # serve every instance type the pool offers.
      templateName: talos-nocloud-template
      # Optional per pool: instanceFamilies, limits, bootDevice, taints, labels, weight, expireAfter,
      # extraRequirements, disruption, securityGroups.

  # Secret holding the join config under key `user-data`, as produced by the cluster factory.
  joinSecret:
    name: karpenter-talos-join
    namespace: kube-system
  # Proxmox credentials (url/insecure/token_id/token_secret/region under key config.yaml).
  credentialsSecret: karpenter-provider-proxmox
  ccm:
    enabled: true
    # For a PoC this reuses the provider's credential. Give the CCM its own read-only token
    # (VM.Audit, Sys.Audit, VM.GuestAgent.Audit) when it matters.
    existingConfigSecret: karpenter-provider-proxmox

# Which class of cluster this is: 'dev' or 'infra'. REQUIRED — the chart fails rather than defaulting,
# because guessing wrong would grant dev-level access on a cluster that must keep working (or vice
# versa). A cluster binds only its own class's roles, so this is what keeps the two axes isolated.
clusterClass: ""

clusterAccess:
  # Prefix the API server applies to the token's groups claim (oidc-groups-prefix). Binding subjects
  # must match it, hence sso:k8s-dev-admin. Not cosmetic: without a prefix a Keycloak role named
  # system:masters would land verbatim in the token and be honoured as cluster-admin.
  subjectPrefix: "sso:"

storage:
  # The NFS subdir provisioner points at the NAS on the storage LAN (192.168.88.25), which clusters on
  # other classes cannot reach — it would sit ContainerCreating and time out. Storage is its own pass;
  # enable this once the NAS is reachable from the cluster's class.
  nfs:
    enabled: false
