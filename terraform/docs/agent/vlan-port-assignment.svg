<text x="150" y="273" font-size="11.5" fill="#cdd3de">spare</text>
<rect x="789.5" y="259" width="44.5" height="19" rx="9" fill="#8a8a8a"/>
<text x="811.75" y="273" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2b2b2b">spare</text>
