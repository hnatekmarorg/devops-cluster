# If it is onprem cluster chart deploys additional things such as storage solutions
onprem: true
# TLS issuance for cluster ingresses. The credential's SOURCE depends on the cluster's role:
#   - the cluster that terminates public traffic (the bootstrap / "reverse proxy" cluster) must use
#     `sops`: it cannot fetch a cert-issuing token from the vault it itself hosts. It opts into the
#     operator with `sops.enabled: true` (below) and sets `cloudflare.secretSource: sops`.
#   - every other cluster uses the default `eso`, pointing at the vault in its own site.
# The created Secret's NAME and KEY are identical either way, so the ClusterIssuer never changes.
certManager:
  enabled: true
  email: m.hnatma@gmail.com
  cloudflare:
    secretSource: eso               # sops | eso
    secretName: cloudflare-api-token-secret
    secretKey: api-token
  # The secretName above must already exist, created one of two ways:
  #   sops → a SopsSecret in this cluster's own config tree (per-repo ciphertext), e.g.
  #          devops/argocd/secrets/enc.cloudflare.yaml, decrypted by the sops-secrets-operator
  #   eso  → ExternalSecret below, reading from the vault in this cluster's site
  eso:
    enabled: true                   # true when secretSource is eso (the default)
    # The vault auth mount for THIS cluster: must match auth/kubernetes-<clusterName> as enabled by
    # scripts/wire-vault.sh. Not shareable — the mount holds one CA and one reviewer token, and a
    # rebuilt cluster has a new CA.
    mountPath: ""
    storeName: local
    storeServer: https://bao.srv.hnatekmar.dev     # home clusters; hetzner uses bao.hnatekmar.xyz
    vaultPath: hermes/data/cloudflare-api   # the KV MOUNT (ClusterSecretStore path)
    # The path INSIDE the mount. Must fall under this cluster's prefix — the vault policy grants
    # secret/<cluster>/* only. Empty derives <clusterName>/cloudflare.
    vaultKey: ""
    vaultRole: ""

# The sops-secrets-operator, which decrypts SopsSecrets in-cluster (per-repo ciphertext, see
# https://github.com/isindir/sops-secrets-operator). Off by default: the default credential route is
# ESO above. The reverse-proxy cluster — which cannot read the vault it hosts — enables this and
# switches certManager.cloudflare.secretSource back to sops.
sops:
  enabled: false

# The autoscaling idiom — see terraform/docs/agent/cluster-autoscaling.md.
# Proxmox-specific, so gated on `onprem` above.
karpenter:
  enabled: true
  # Must match the `region` in the Proxmox credentials config used by BOTH provider and CCM.
  region: balteus

  # What every pool inherits. A pool overrides per key; nothing here is per-cluster beyond these defaults.
  defaults:
    bootDevice:
      # The node's own disk. The provider attaches its own cloud-init CD-ROM, so the template does not
      # need one — and a template with a cloud-init drive on a SECOND storage fails with
      # `Multiple storage IDs found for template`.
      size: 30G
      # This storage ALSO selects the zones: the provider derives them from it and counts only zones that
      # can see the template. The wrong one yields `TemplatesNotFound`, which reads like a template-name
      # problem and is not one. NOTE for a second PVE host: `iscsi` is an LVM over one iSCSI LUN and
      # reports shared=0, so the template AND this storage must exist under the same names on every node
      # a clone may land on — see terraform/docs/agent/cluster-autoscaling.md.
      storage: iscsi
    # Karpenter's own grid: c1=1:2 t1=1:3 s1=1:4 m1=1:8 x1=1:16, N ∈ {1,2,4,8,16}. The instance type IS
    # the node size (m1.4VCPU-32GB → 4 cores / 32 GiB). Adding a family only widens what may be chosen.
    instanceFamilies: ["c1", "t1", "s1"]
    # A BUDGET, not the machine's size. The provider does not overcommit memory and Proxmox reserves
    # nothing, so a limit near the host's capacity lets a pool race every other VM on the box —
    # measured on balteus 2026-09-19: 128 cores / 1008 GiB total with ~447 GiB already held by 51 VMs
    # (the NAS VM alone holds 256 GiB). Clusters that want more state it themselves; see the two
    # Applications under bootstrap/argocd/.
    limits:
      cpu: "8"
      memory: 32Gi
    disruption:
      # WhenEmpty + a short consolidateAfter is what turns an idle burst node back into free RAM; the
      # provider will not stop a node that still has pods.
      consolidationPolicy: WhenEmpty
      consolidateAfter: 1m
    expireAfter: Never

  # THE POOLS. Each entry renders a ProxmoxNodeClass + a NodePool; the ProxmoxUnmanagedTemplate is
  # rendered once per distinct templateName. Adding a pool — CPU, memory-optimised, GPU — is a values
  # change, not a template change.
  #
  # A GPU pool needs more than values: a PVE PCI resource mapping (PVE takes the FIRST FREE device from
  # the mapping at VM start, which is how two nodes hold two different cards) plus the NVIDIA extensions
  # in the node image. Neither exists yet — see the doc before adding one.
  pools:
    - name: talos-nocloud-template
      # The NAME of the PVE template to clone, searched on every Proxmox node. It must carry the class
      # VLAN tag on net0, the storage bridge on net1 and cpu=x86-64-v2-AES, and it must be big enough to
      # serve every instance type the pool offers.
      templateName: talos-nocloud-template
      # Optional per pool: instanceFamilies, limits, bootDevice, taints, labels, weight, expireAfter,
      # extraRequirements, disruption, securityGroups.

  # Secret holding the join config under key `user-data`, as produced by the cluster factory.
  joinSecret:
    name: karpenter-talos-join
    namespace: kube-system
  # Proxmox credentials (url/insecure/token_id/token_secret/region under key config.yaml).
  credentialsSecret: karpenter-provider-proxmox
  ccm:
    enabled: true
    # For a PoC this reuses the provider's credential. Give the CCM its own read-only token
    # (VM.Audit, Sys.Audit, VM.GuestAgent.Audit) when it matters.
    existingConfigSecret: karpenter-provider-proxmox

# Which class of cluster this is: 'dev' or 'infra'. REQUIRED — the chart fails rather than defaulting,
# because guessing wrong would grant dev-level access on a cluster that must keep working (or vice
# versa). A cluster binds only its own class's roles, so this is what keeps the two axes isolated.
clusterClass: ""

clusterAccess:
  # Prefix the API server applies to the token's groups claim (oidc-groups-prefix). Binding subjects
  # must match it, hence sso:k8s-dev-admin. Not cosmetic: without a prefix a Keycloak role named
  # system:masters would land verbatim in the token and be honoured as cluster-admin.
  subjectPrefix: "sso:"

storage:
  # Both tiers live on the NAS; what differs is the protocol and, by design, the plane:
  #   * block (RWO)  — NVMe-oF/TCP via the official `truenas-csi` driver (`truenasCsi` below)
  #   * shared (RWX) — NFS via the subdir provisioner (`nfs` below)
  # Both use the *storage* name (`truenas.storage.hnatekmar.dev` = 192.168.88.25 on the air-gapped 10G
  # island) rather than the srv one (172.16.40.148, 1G management). The two are deliberately NOT
  # interchangeable: the appliance answers NFS/iSCSI/NVMe-oF on the management address too, so the
  # wrong name is a 1G data path rather than an error. The API in contrast stays on the srv name.
  nfs:
    # Off by default: it needs the cluster's class to reach the storage LAN. dev's nodes carry a second
    # NIC on the island (vmbr2, MTU 9000) and lease their island addresses from the island's own DHCP.
    enabled: false
    server: truenas.storage.hnatekmar.dev
    # The base path must exist and be exported on the appliance: `/mnt/data/k8s` is exported, and the
    # per-PVC path comes from the PVC's `nfs.io/storage-path` annotation.
    path: /mnt/data/k8s/clusters/main
  # The block tier. Requires TrueNAS 25.10+ with the NVMe-oF service enabled; this estate runs 25.10.7
  # with a TCP port on 192.168.88.25:4420 and the driver's API key in the vault under
  # `secret/<cluster>/truenas-csi`.
  truenasCsi:
    enabled: false
    # THE CHART IS VENDORED in this repository (`charts/truenas-csi`), which is what lets it carry a
    # hostPath fix that no chart value can express — see that directory's VENDORED.md for the two
    # deviations and the re-sync recipe. `chartVersion` records which upstream release was copied, so a
    # re-sync diffs against a known point instead of against nothing.
    chartVersion: "1.3.0"
    chartRepoURL: https://github.com/hnatekmarorg/devops-cluster.git
    chartRevision: HEAD
    chartPath: charts/truenas-csi
    namespace: truenas-csi
    # CONTROL PLANE — the API over the srv VLAN, which is routable from every cluster class.
    url: wss://truenas.srv.hnatekmar.dev
    # DATA PLANE — the island, for the volume traffic itself.
    #
    # NOTE the asymmetry, which is measured rather than stylistic: `nfsServer` may be a NAME (the node
    # resolves it — verified: a kubelet-mounted NFS volume on dev-w1 came up against
    # truenas.storage.hnatekmar.dev over the island NIC), but `nvmeofPortal` must be an IPv4/IPv6
    # LITERAL. The driver does not merely hand the portal to `nvme connect`; it first resolves it to a
    # port ON THE APPLIANCE and will CREATE one if none matches — and `nvmet.port.create` rejects a
    # hostname outright: `addr_traddr … value is not a valid IPv4 or IPv6 address`. With a name every
    # provisioning attempt fails before a zvol is ever made. The appliance's port is
    # `192.168.88.25:4420`, so this is that, spelled the way the API demands.
    nfsServer: truenas.storage.hnatekmar.dev
    nvmeofPortal: 192.168.88.25:4420
    iscsiPortal: 192.168.88.25:3260
    # The appliance ships a self-signed certificate (CN=localhost): without this the pods never go Ready.
    insecureSkipTLS: true
    pool: data
    # Volume datasets land at <pool>/<datasetPath>/<pvc-name>. The NAS snapshots this parent daily and
    # recursively, which is why the StorageClass sets no snapshot.schedule of its own.
    datasetPath: nvmeof
    # Talos' kubelet root. Must match the hostPath the node plugin mounts, or NFS-backed volumes mount
    # inside the plugin and never reach kubelet.
    kubeletDir: /var/lib/kubelet
    # The API key, produced by ESO from the vault: `secret/<cluster>/truenas-csi` by default.
    existingSecret: truenas-csi-api
    existingSecretKey: api-key
    vaultKey: ""
    metrics:
      enabled: false
    storageClasses:
      nvmeof:
        enabled: true
        name: truenas-nvmeof
        default: false
        volblocksize: 16K
        sparse: "true"

# Service VIPs. MetalLB hands out the addresses `type: LoadBalancer` Services get, which on this cluster
# means the ingress controller's — without it that Service is `<pending>` forever and every Ingress is
# unreachable however healthy its certificate looks.
#
# WHERE THE RANGE COMES FROM. The estate reserves 172.16.48.0/20 for exactly this (the `svc-vips`
# address list in terraform/routeros/main.tf, which the firewall rules read; the srv DHCP pool states
# that the block must never appear in it). The placement is structural rather than tidy: srv's router
# interface is 172.16.40.1/19, so a VIP in 172.16.48.0/20 and the node announcing it are in ONE subnet.
# That is what makes L2 announcement work with no routing protocol, no BGP peer on the router and no FRR
# privileges on the speaker. BGP stays the upgrade path if single-announcer L2 ever becomes a real
# constraint, and the range works there unchanged.
#
# The /20 is shared by every cluster and by future three-control-plane API VIPs, so each cluster takes a
# /24 and STATES it — a pool that defaulted would be a pool two clusters could claim at once:
#
#   172.16.48.0/24   dev      this cluster; ingress VIP 172.16.48.1
#   172.16.49.0/24   spare    the next cluster takes it, same shape
#   the rest         API VIPs for three-control-plane clusters. terraform/modules/talos-cluster/
#                    variables.tf documents the intent; nothing claims one yet.
metallb:
  # Off by default, and the pool is empty on purpose: both are per-cluster statements. A cluster enables
  # this in its own values (bootstrap/argocd/<cluster>/cluster-base.yaml) with its own /24.
  enabled: false
  pool:
    name: svc-vips
    addresses: []
  # The ingress VIP. Pinned, not first-come-first-served: published DNS names point at this address, and
  # an address that could move between resyncs is a DNS record that silently rots.
  ingressVIP: ""
