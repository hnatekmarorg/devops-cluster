# Device IaC — apply on merge (the only path that writes to a device).
#
# Triggers only when a reviewed PR that changes terraform/** lands on main, and only when the repo
# variable ROUTEROS_CI_ENABLED is 'true' (the arming switch).
#
# ONE JOB PER DEVICE, and each is a *plain* job — not a caller of a reusable workflow. That shape is
# forced by the two facts measured here:
#   * `environment:` is not available on a job that `uses:` a reusable workflow (GitHub rejects the
#     whole file), and
#   * declaring the environment inside the called workflow does gate the job, but the environment's
#     secrets do not reach that job's env: run 34937366672 (2026-09-15) printed
#     `ROS_WRITE_USERNAME:` empty on the crs326 job while `crs326-production` had it set.
# So each device gets its own job with the environment on it, the write identity in the job env, and
# the shared steps live in the composite action `.github/actions/tofu-apply` (duplication of the logic
# was the thing being avoided, not of the job).
#
# The gate remains per device: approving the router's apply says nothing about the switch's, so one
# merge can be applied to one device and declined for the other.
name: tf-apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-*.yml'
      - '.github/actions/**'
      - 'scripts/tofu-ci.sh'
  workflow_dispatch:
    inputs:
      note:
        description: 'Why this apply is being run (recorded in the run summary)'
        required: false
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # The arming switch is read from `vars` here, at workflow level, because a composite action has no
  # `vars` context ("Unrecognized named-value: 'vars'", measured) — it is passed down as plain env.
  ROUTEROS_CI_ENABLED: ${{ vars.ROUTEROS_CI_ENABLED || 'false' }}
  # The runner pod egresses through a proxy; LAN traffic must bypass it or the call to the device gets
  # proxied and fails. Uppercase only — Go's httpproxy checks NO_PROXY first, and both spellings are
  # one key to GitHub's env.
  NO_PROXY: 'localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,.svc,.cluster.local'
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  # Measured, not assumed: the in-cluster MinIO name does not resolve from the ARC runner. The
  # endpoint below is the one verified to work from both the runner and a LAN host.
  TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT || 'https://console-minio.hnatekmar.xyz' }}
  # MinIO advertises `europe` (x-amz-bucket-region); signing with anything else risks a mismatch.
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'europe' }}

jobs:
  apply-routeros:
    name: apply · routeros (RB5009)
    runs-on: gha-runner-scale-set-hnatekmarorg
    # Second gate, independent of the merge: this environment has Martin as a required reviewer, so the
    # job waits for an explicit approval before it starts — and it is what scopes the write identity.
    environment: routeros-production
    # Applies are serialised per device: one writer at a time, ever.
    concurrency:
      group: tf-apply-routeros
      cancel-in-progress: false
    # Device-specific: the endpoint, the state key, and the write identity. The key is never shared
    # between devices, and the endpoint sits next to it so a wrong pair is visible in one glance.
    env:
      ROS_HOSTURL: api://172.16.100.1:8728
      TF_STATE_KEY: routeros/rb5009.tfstate
      ROS_WRITE_USERNAME: ${{ secrets.ROS_WRITE_USERNAME }}
      ROS_WRITE_PASSWORD: ${{ secrets.ROS_WRITE_PASSWORD }}
      # State credential (repository-scoped — the state is not a device).
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      # Checkout stays in the job, not in the composite: GitHub resolves a local action by reading its
      # files from the workspace, which does not exist until checkout has run.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tofu-apply
        with:
          module: routeros
          note: ${{ inputs.note || '' }}

  apply-crs326:
    name: apply · crs326 (main switch)
    runs-on: gha-runner-scale-set-hnatekmarorg
    environment: crs326-production
    concurrency:
      group: tf-apply-crs326
      cancel-in-progress: false
    env:
      ROS_HOSTURL: api://172.16.100.2:8728
      TF_STATE_KEY: crs326/crs326.tfstate
      ROS_WRITE_USERNAME: ${{ secrets.ROS_WRITE_USERNAME }}
      ROS_WRITE_PASSWORD: ${{ secrets.ROS_WRITE_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      # Checkout stays in the job, not in the composite (see the routeros job above).
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tofu-apply
        with:
          module: crs326
          note: ${{ inputs.note || '' }}
