---
# cluster-base for the PROD cluster, as an ArgoCD Application. Draft — see the PR body.
#
# This directory is what bootstrap-cluster.sh hands to ArgoCD (the root Application recurses over
# bootstrap/argocd/<cluster>). It is the only per-cluster file the bootstrap needs, and the only place
# where prod differs from dev in a way that is about *access*.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/hnatekmarorg/devops-cluster.git
    targetRevision: HEAD
    path: charts/cluster-base

    helm:
      # THE ONE VALUE THAT MATTERS MOST HERE. `infra` is what makes this cluster bind
      # sso:k8s-infra-viewer / sso:k8s-infra-admin instead of the dev tier — the whole point of the
      # class axis. The chart refuses to render without it, deliberately: guessing wrong would grant
      # dev-level access on the cluster that must keep working.
      values: |
        clusterClass: infra

        clusterName: prod
        certManager:
          cloudflare:
            secretSource: eso
          eso:
            enabled: true
            storeName: local-prod
            storeServer: https://bao.srv.hnatekmar.dev
            vaultPath: secret              # the KV mount; the KEY below picks common/ vs prod/
            mountPath: kubernetes-prod     # must match what wire-vault.sh enabled
            vaultRole: local-prod
            # SHARED, and that is the chart default now: one Cloudflare token for one zone, so one copy
            # in the vault. A per-cluster copy is what failed here first — `secret/prod/*` never
            # existed, so cert-manager sat on `SecretSyncedError: Secret does not exist` while the
            # store itself validated.
            vaultKey: common/cloudflare

        # Prod's autoscaling ceiling. The families are stated EXPLICITLY now that pools live in values,
        # and they stay c1/t1/s1: deliberately no m1/x1 on a box that is also the storage host.
        karpenter:
          pools:
            - name: talos-nocloud-template
              templateName: talos-nocloud-template
              instanceFamilies: ["c1", "t1", "s1"]
              limits:
                cpu: "32"
                memory: 128Gi

        # Service VIPs for this cluster: prod takes 172.16.49.0/24 out of the estate's reserved
        # 172.16.48.0/20 (the table in charts/cluster-base/values.yaml). The `svc-vips` address list in
        # terraform/routeros/main.tf carries the whole /20, so this range needed no firewall change.
        # The /20 sits inside srv's /19 on purpose — VIP and announcing node share a subnet, so MetalLB
        # stays in L2 mode with no routing protocol involved.
        #
        # Needed for parity before anything is deployed: without it the ingress controller's Service is
        # `<pending>` forever and every Ingress is unreachable, however healthy its certificate looks.
        # (This cluster came up without it: nginx was declared, had no address to sit on, and its
        # Application never got created.)
        metallb:
          enabled: true
          pool:
            addresses:
              - 172.16.49.1-172.16.49.254
          ingressVIP: 172.16.49.1

        # Storage over the air-gapped 10G island — the same two tiers as dev, against the same
        # appliance, addressed by the *storage* name (192.168.88.25) rather than the srv one: the
        # appliance answers NFS/iSCSI/NVMe-oF on the management address too, so the wrong name is a 1G
        # data path rather than an error.
        #
        # PREREQUISITE, and it is provisioning rather than values: prod's nodes need the island NIC.
        # terraform/clusters/dev/main.tf sets `storage_bridge = "vmbr2"`; prod's does not, so nothing on
        # this cluster can reach 192.168.88.0/24 yet. Until that lands an NFS PVC stays Pending and a
        # `truenas-nvmeof` PVC fails at provision time — both of which read like a NAS fault.
        storage:
          # RWX over NFS (`nfs-client`).
          nfs:
            enabled: true
          # RWO block over NVMe-oF/TCP (class `truenas-nvmeof`). The API key is SHARED at
          # `secret/common/truenas-csi`; the control plane (`wss://truenas.srv.hnatekmar.dev`) is
          # already reachable from this class.
          truenasCsi:
            enabled: true
            vaultKey: common/truenas-csi

  destination:
    server: https://kubernetes.default.svc   # in-cluster
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
