<text x="60" y="177" font-size="11.5" font-family="monospace" fill="#e6e9ef">ether1</text>
<text x="150" y="177" font-size="11.5" fill="#cdd3de">escape port — mgmt, never tagged, pre-assign first</text>
<rect x="795.6" y="163" width="38.4" height="19" rx="9" fill="#cfe0ff"/>
<text x="814.8" y="177" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f3b73">mgmt</text>
