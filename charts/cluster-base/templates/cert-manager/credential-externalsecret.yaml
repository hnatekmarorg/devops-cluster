{{- if and .Values.certManager.enabled .Values.certManager.eso.enabled (eq .Values.certManager.cloudflare.secretSource "eso") }}
# The cert-issuing token, fetched from the vault. Used by every cluster EXCEPT the one that terminates
# public traffic — that one sources it via SOPS, because it cannot read from the vault it hosts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.certManager.cloudflare.secretName }}
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.certManager.eso.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.certManager.cloudflare.secretName }}
  data:
    - secretKey: {{ .Values.certManager.cloudflare.secretKey }}
      remoteRef:
        # NOT vaultPath — that is the KV MOUNT. remoteRef.key is the path INSIDE the mount, and the
        # cluster's read policy grants two prefixes: `common/*` (shared estate-wide — where the
        # Cloudflare token lives by default, see values.yaml) and `<cluster>/*` (cluster-only values).
        # Sharing one value for both roles made ESO request the path 'secret/secret', which no policy
        # covers, so the sync failed in a way that looked like a permissions problem.
        key: {{ .Values.certManager.eso.vaultKey | default (printf "%s/cloudflare" .Values.clusterName) }}
        property: {{ .Values.certManager.cloudflare.secretKey }}
{{- end }}
