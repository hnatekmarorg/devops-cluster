{{- if and .Values.onprem .Values.inference.enabled .Values.inference.registrySecret.vaultKey }}
# The registry pull credential, stored in the vault as ONE key (`dockerconfigjson` holding the
# whole docker config JSON text) — so the ExternalSecret stays a 1:1 key mapping and no second
# template engine's delimiters appear inside this one. The backtick form is Helm emitting a
# literal action for ESO to evaluate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry
  namespace: inference
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.certManager.eso.storeName | quote }}
    kind: ClusterSecretStore
  target:
    name: forgejo-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.inference.registrySecret.vaultKey | quote }}
        property: dockerconfigjson
{{- end }}
