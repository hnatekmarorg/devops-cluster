{{- range .Values.models }}
{{- $scale := .scale | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    llm: {{ .name }}
    # SCALE reads these two (strings, by convention) and moves replicas between them.
    scale.on-replicas: {{ $scale.on | default 1 | quote }}
    scale.off-replicas: {{ $scale.off | default 0 | quote }}
spec:
  # A resident model spans both cards (TP2 on the 3090 node), so an update cannot roll:
  # kill, then start. Same trade the .189 quadlets' Conflicts= made.
  strategy:
    type: Recreate
  replicas: {{ $scale.off | default 0 }}
  selector:
    matchLabels:
      llm: {{ .name }}
  template:
    metadata:
      labels:
        llm: {{ .name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      # Talos' nvidia-container-toolkit extension injects the driver libraries; the device
      # plugin's DaemonSet runs on the same pools (karpenter.nvidia.poolNames).
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      {{- with .nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 120
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: models
          nfs:
            server: {{ required "storage.nfs.server is required" $.Values.storage.nfs.server | quote }}
            path: {{ required "storage.nfs.path is required" $.Values.storage.nfs.path | quote }}
      containers:
        - name: vllm
          image: {{ required (printf "model %q: image is required" .name) .image }}
          imagePullPolicy: IfNotPresent
          {{- with .command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          args:
{{ toYaml (required (printf "model %q: args are required" .name) .args) | indent 12 }}
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            {{- range $.Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .port | default 8030 }}
              protocol: TCP
              name: http
          resources:
{{ toYaml .resources | indent 12 }}
          # /health answers once the model is up; the big ones take minutes to load, so startup
          # gets a 15-minute budget and readiness — not liveness — gates traffic. No liveness
          # probe: killing a loading model is worse than a pod that simply stays NotReady.
          # `probePath` overrides /health for servers that answer elsewhere (sd-server: /).
          startupProbe:
            httpGet:
              path: {{ .probePath | default "/health" }}
              port: http
            periodSeconds: 15
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ .probePath | default "/health" }}
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  selector:
    llm: {{ .name }}
  ports:
    - protocol: TCP
      port: {{ .port | default 8030 }}
      targetPort: http
  type: ClusterIP
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ required "host is required" .Values.host }}
      secretName: {{ .Values.host }}-tls
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
{{- range .Values.models }}
          - path: /{{ .name }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .name }}
                port:
                  number: {{ .port | default 8030 }}
{{- end }}
