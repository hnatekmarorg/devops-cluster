---
# ⚠️ NEGATIVE EXPERIMENT — DO NOT PROMOTE. Measured 2026-09-14: with this MR
# present the rehearsal instance took 176 requests / 150 s; without it, 0.
# Against OpenBao the provider's call 404s (no handler for route .../secret-id)
# while the same route works by CLI, so the MR only ever retries.
# THIS IS THE ARTEFACT UNDER TEST.
#
# Hypothesis: a declaratively-managed AuthBackendRoleSecretID cannot be
# observed reliably (the SecretID value is create-only), so the reconciler
# re-issues it — each iteration a storage write + an audit entry. On the old
# file backend that produced millions of files (inode exhaustion).
#
# Expected outcomes:
#   * NO LOOP  -> MR status settles Ready, request counter flattens; then this
#                 resource type is safe to use in production with num_uses=1.
#   * LOOP     -> status oscillates (Creating/Ready repeatedly) and the request
#                 counter climbs with no user activity; then production keeps
#                 issuing SecretIDs out-of-band (bao write -f auth/approle/role/<role>/secret-id)
#                 and this resource type is never used against the live Bao.
apiVersion: approle.vault.upbound.io/v1alpha1
kind: AuthBackendRoleSecretID
metadata:
  name: atuin-ro-secretid
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  providerConfigRef:
    name: bao-staging
  forProvider:
    backendRef:
      name: approle
    roleNameRef:
      name: atuin-ro
  writeConnectionSecretToRef:
    name: atuin-ro-secretid
    namespace: crossplane-system
