{{- if and .Values.onprem .Values.karpenter.enabled .Values.karpenter.nvidia.enabled }}
{{- $poolNames := .Values.karpenter.nvidia.poolNames }}
{{- if not $poolNames }}{{ fail "karpenter.nvidia.poolNames (a list, one entry per GPU pool) is required when the nvidia stack is enabled" }}{{ end }}
# The NVIDIA stack for GPU pools — the two halves of "a GPU node advertises nvidia.com/gpu", both only
# on the GPU nodes:
#   * the RuntimeClass: Talos' nvidia-container-toolkit extension wires the driver libraries into
#     containerd as a runtime named `nvidia`, and nothing gets those libraries (or the device nodes)
#     injected without `runtimeClassName: nvidia`. The plugin itself and every GPU workload use it.
#   * the plugin: it is what registers nvidia.com/gpu with the kubelet.
# The affinity names the GPU pools (one entry per NodePool): their nodes carry
# `karpenter.sh/nodepool: <name>` from Karpenter itself, while the CPU nodes have no nvidia runtime
# handler at all — a plugin pod there fails with RunContainerError. The toleration matches the pools'
# taint; GPU pools are the only place it runs.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
# NVIDIA k8s-device-plugin v0.17.4, upstream DaemonSet trimmed to what this estate needs, plus the two
# additions above. The GPU devices reach the container through the runtime, not through volumeMounts.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      # A nodeSelector cannot express a set of pools, and the estate runs more than one GPU pool
      # (bukefalos' A4000s, balteus' 3090s) — so the plugin selects them by affinity, one
      # `karpenter.nvidia.poolNames` entry per NodePool.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values:
{{- range $pool := $poolNames }}
                      - {{ $pool | quote }}
{{- end }}
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: "system-node-critical"
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.17.4
        name: nvidia-device-plugin-ctr
        env:
          - name: FAIL_ON_INIT_ERROR
            value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: kubelet-device-plugins-dir
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: kubelet-device-plugins-dir
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: Directory
{{- end }}
