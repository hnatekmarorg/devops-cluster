<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1560" viewBox="0 0 1720 1560">
<rect width="100%" height="100%" fill="#0f1115"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#f5f7fa">Port assignment — the stage-2 contract</text>
<text x="40" y="66" font-size="12" fill="#8b93a4">Every port, what it goes to, which class it carries. Measured 2026-09-14; reasoning and the as-is wiring live in network-wiring.md.</text>
<text x="40" y="86" font-size="12" fill="#8b93a4">Trunks keep native VLAN 1 (compat) until the last device has moved — that is the migration mechanism. After that: tagged-only, pvid 999 (parking, unrouted).</text>
<rect x="40" y="110" width="808" height="678" rx="10" fill="#15171c" stroke="#333844"/>
<text x="54" y="136" font-size="15" font-weight="600" fill="#f0f2f6">RB5009 — 172.16.100.1</text>
<text x="54" y="156" font-size="11" fill="#8b93a4">router · Marvell 88E6393X · 9/9 ports hardware-offloaded</text>
