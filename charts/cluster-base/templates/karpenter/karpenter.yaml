{{- if and .Values.onprem .Values.karpenter.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  sources:
    # NO oci:// scheme. ArgoCD resolves the wrapper package from the registered repository
    # (templates/argocd/repository-oci.yaml, enableOCI=true); with the scheme present it computes
    # ghcr.io/v2/sergelogvinov/charts and GHCR answers 403 for the token request.
    - repoURL: ghcr.io/sergelogvinov/charts
      chart: karpenter-provider-proxmox
      # Chart 0.4.9 ships provider v0.12.0. The old pin (0.1.0 -> v0.3.0) ships a ClusterRole that
      # cannot list proxmoxtemplates/proxmoxunmanagedtemplates, so the controller crash-loops on
      # reflectors and the NodePool never reconciles ("NodeClassReady=Unknown").
      targetRevision: "0.4.9"
      helm:
        releaseName: karpenter
        valuesObject:
          # TOP LEVEL, not under `settings:`. The chart reads .Values.existingConfigSecret, so nesting it
          # under settings made the release look for a secret named <release>-<chart> that never existed —
          # the pod sat in ContainerCreating on `secret "karpenter-karpenter-provider-proxmox" not found`.
          existingConfigSecret: {{ .Values.karpenter.credentialsSecret }}
          existingConfigSecretKey: config.yaml
          # The provider's stock grid stops at 16 vCPU and advertises no GPU capacity; the file
          # rendered by templates/karpenter/instance-types.yaml replaces it wholesale.
          extraEnvs:
            - name: INSTANCE_TYPES_FILE
              value: /etc/karpenter/instance-types.json
          extraVolumes:
            - name: instance-types
              configMap:
                name: karpenter-instance-types
          extraVolumeMounts:
            - name: instance-types
              # Its own directory mount, NOT a subPath file under /etc/proxmox: that path is the
              # credentials secret's directory mount, and a file mount nested inside it fails at
              # container start with `mount ...: not a directory` (observed live 2026-10-10).
              mountPath: /etc/karpenter
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
