name: kubeconfig-comment

# Posts a cluster's kubeconfig as a PR comment whenever the committed file changes.
#
# Why a comment rather than just the committed file: the kubeconfig is the deliverable, and a file in a
# diff is not something anyone can pick up. It also removes the silent-staleness problem — if the file
# changes (a rebuild produces a new CA), the comment is updated to match, so whatever is on the PR is
# what the cluster actually serves.
#
# Safe to post publicly: the kubeconfig contains no credential — endpoint, public CA, and a kubelogin
# exec block. The identity lives in Keycloak. scripts/kubeconfig.sh enforces that invariant.

on:
  pull_request:
    paths:
      - 'terraform/clusters/**/kubeconfig.yaml'

permissions:
  pull-requests: write
  contents: read

jobs:
  comment:
    # Match the other workflows in this repo. A label no runner carries makes the job queue forever
    # with no error at all — which is exactly what this did for an hour, and it looked like the runner
    # being stuck.
    runs-on: [self-hosted, mgmt, tofu]
    steps:
      - uses: actions/checkout@v4

      - name: Post or update the kubeconfig comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='<!-- kubeconfig-comment -->'

          for f in $(git ls-files 'terraform/clusters/*/kubeconfig.yaml'); do
            cluster=$(basename "$(dirname "$f")")
            body_file=$(mktemp)
            {
              echo "$MARKER"
              echo "### \`$cluster\` kubeconfig"
              echo
              echo "Generated from \`$f\`. Contains **no credential** — endpoint, public CA and a"
              echo "\`kubelogin\` exec block; the identity is a Keycloak session."
              echo
              echo '<details><summary>click to expand</summary>'
              echo
              echo '```yaml'
              cat "$f"
              echo '```'
              echo
              echo 'Usage: save it as `~/.kube/'"$cluster"'`, then `kubectl auth whoami`.'
              echo 'Needs `kubelogin` installed.'
              echo '</details>'
            } > "$body_file"

            # update in place if this PR already has our comment for this cluster, else create it
            existing=$(gh api "repos/$REPO/issues/$PR/comments" \
              --jq "[.[] | select(.body | contains(\"$MARKER\") and contains(\"### \\\`$cluster\\\` kubeconfig\"))] | .[0].id // empty" 2>/dev/null || true)

            if [ -n "${existing:-}" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$body_file" >/dev/null
              echo "updated comment for $cluster"
            else
              gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body_file" >/dev/null
              echo "created comment for $cluster"
            fi
          done
