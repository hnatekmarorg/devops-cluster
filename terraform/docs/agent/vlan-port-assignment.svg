<text x="982" y="389" font-size="11.5" fill="#cdd3de">free 10 G — opportunity: 10 G uplink or the CSS610 hop</text>
<rect x="1621.5" y="375" width="44.5" height="19" rx="9" fill="#8a8a8a"/>
<text x="1643.75" y="389" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2b2b2b">spare</text>
<text x="886" y="774" font-size="11" fill="#8b93a4">Escape ports (ether3 here, ether1 on the router) are pre-assigned before anything else changes.</text>
