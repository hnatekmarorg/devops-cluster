# The model-serving chart: one Deployment + Service per `models[]` entry, all behind one
# path-per-model Ingress on `host`. Entries start at their `scale.off` replica count; SCALE
# (github.com/hnatekmarorg/scale) flips them between off/on through the `scale.*` labels —
# the swap-by-nature contract the .189 quadlets' `Conflicts=` encoded.
#
# The per-model shape mirrors what those quadlets said, field for field:
#   * `args` is the quadlet's Exec verbatim (the model path first);
#   * `command` exists only for images without an entrypoint — vllm-openai and the patched
#     builds carry `vllm serve` as their entrypoint, vllm-omni carries none;
#   * `port` is the served port; the Ingress publishes one path per model at /<name>.

host: ""                # ingress host; the chart refuses to render without it
imagePullSecrets: []    # e.g. [{name: forgejo-registry}]

# The NAS export that holds every model dir, mounted read-only at /models in every pod.
# Addressed by the *storage* name (the island plane), never the srv one.
storage:
  nfs:
    server: truenas.storage.hnatekmar.dev
    path: /mnt/data/k8s/ai

env: []                 # env for every model pod (NCCL/allocator flags live here); per-model `env` appends

models: []
