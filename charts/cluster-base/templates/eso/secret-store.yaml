{{- if and .Values.certManager.eso.enabled .Values.certManager.eso.storeServer }}
# The vault in THIS cluster's site. `kubernetes` auth means the vault calls TokenReview on this
# cluster's API server, so vault and cluster have to be in the same site — a vault across a WAN turns
# that into an inbound path into the LAN.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.certManager.eso.storeName }}
spec:
  provider:
    vault:
      server: {{ .Values.certManager.eso.storeServer }}
      path: {{ .Values.certManager.eso.vaultPath }}
      version: v2
      auth:
        kubernetes:
          # PER CLUSTER, and it cannot be shared: auth/kubernetes/config holds one kubernetes_ca_cert
          # and one token_reviewer_jwt, and both differ per cluster — a rebuilt cluster has a new CA.
          # scripts/wire-vault.sh enables auth/kubernetes-<cluster>.
          mountPath: {{ .Values.certManager.eso.mountPath | default (printf "kubernetes-%s" (required "clusterName is required when ESO is enabled: the vault auth mount is per cluster" .Values.clusterName)) }}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
          {{- if .Values.certManager.eso.vaultRole }}
          role: {{ .Values.certManager.eso.vaultRole }}
          {{- end }}
{{- end }}
