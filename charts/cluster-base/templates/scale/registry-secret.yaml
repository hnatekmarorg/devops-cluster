{{- if and .Values.onprem .Values.scale.enabled }}
# The registry pull credential for this namespace — the same vault key the inference stack
# reads; the ExternalSecret stays a 1:1 key mapping (the whole docker config is ONE vault key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry
  namespace: scale
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.certManager.eso.storeName | quote }}
    kind: ClusterSecretStore
  target:
    name: forgejo-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.scale.registrySecret.vaultKey | quote }}
        property: dockerconfigjson
{{- end }}
