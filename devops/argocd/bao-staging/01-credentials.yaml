---
# Staging-only credential for the disposable dev-mode OpenBao.
#
# dev mode pins the root token to the value in values.yaml ("root"), the
# instance is in-memory with no persistence and no ingress. There is nothing
# here to protect — but it must still never be reused for anything real.
apiVersion: v1
kind: Secret
metadata:
  name: bao-staging-token
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
type: Opaque
stringData:
  config: |
    {"token": "root"}
