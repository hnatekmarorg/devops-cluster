{{/*
The RWX tier: per-PVC subdirectories on the NAS, over NFS.

Off by default, and now for a narrower reason than before: the cluster's class has to reach the storage
LAN. dev does — its nodes carry a second NIC on the air-gapped island (vmbr2, MTU 9000, addresses from
the island's own DHCP) and reach the appliance as `truenas.storage.hnatekmar.dev`.

The server is that *storage* name rather than the srv one deliberately. The appliance answers NFS on the
1G management address as well, so `truenas.srv…` would mount successfully over the wrong plane — exactly
the failure this name exists to prevent. Reachability is what the class has to provide, not the protocol.
*/}}
{{- if and .Values.onprem .Values.storage.nfs.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-async
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - chart: nfs-subdir-external-provisioner
      repoURL: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
      targetRevision: 4.0.18
      helm:
        releaseName: nfs-subdir-external-provisioner
        valuesObject:
          volume-name: nfs-async
          # The chart defaults to giving the provisioner its own PVC for scratch space (mounted at
          # /persistentvolumes). This cluster has NO default StorageClass, so that claim renders
          # `storageClassName: ""` with a label selector nothing satisfies: it can never bind, so the
          # provisioner pod can never schedule. And because the provisioner IS what would bind NFS
          # claims, nothing inside the cluster can break that deadlock -- the nfs-client class gets
          # created, reports Ready, and stays permanently empty behind a Pending pod.
          #
          # The provisioner needs no local state; with this off the chart falls back to an emptyDir.
          # (Pointing persistence.storageClass at truenas-nvmeof would also work, but makes the NFS
          # tier depend on the CSI tier for no benefit.)
          persistence:
            enabled: false
          storageClass:
            name: nfs-client
            pathPattern: "${.PVC.annotations.nfs.io/storage-path}"
            onDelete: delete
          nfs:
            server: {{ .Values.storage.nfs.server | quote }}
            mountOptions:
              - hard
              - intr
              - async
              - proto=tcp
              - noacl
              - nfsvers=4.2
              - noatime
            path: {{ .Values.storage.nfs.path | quote }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
{{end}}