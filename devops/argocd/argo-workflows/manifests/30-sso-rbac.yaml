# SSO RBAC — who a logged-in user IS, as far as Kubernetes is concerned.
#
# WHY THIS FILE EXISTS AT ALL: `sso.rbac.enabled: true` (values-dev.yaml) switches argo-server
# into the SSO-RBAC mode where every request is made with a SERVICE ACCOUNT TOKEN selected by a
# rule on the account's annotations — and "if no rule matches, we deny the user access"
# (docs/argo-server-sso.md). Enabled-but-unruled is therefore a server that authenticates
# everyone and authorizes no-one. The rules below mirror the estate's cluster-access groups:
# k8s-dev-admin -> admin, k8s-dev-viewer -> read-only, anyone else -> denied.
#
# The `groups` claim the rules read is realm ROLES carried by the microprofile-jwt scope (see
# 20-sso-client.yaml) — the same claim the clusters' RBAC binds as `sso:k8s-<class>-<tier>`.
#
# Service account tokens are not auto-created since Kubernetes 1.24, so each account carries its
# own kubernetes.io/service-account-token secret below — and the NAME must be
# `${serviceAccountName}.service-account-token` (discovery by name, docs/service-account-secrets.md
# option 1): the server resolves that exact name when no secret is listed on the SA, and a plain
# `-token` suffix fails at authorization time with a "secret not found" that looks like a login
# problem (measured live).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows-sa-admin
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # expr-lang over {groups, iss, sub}; must evaluate to a boolean.
    workflows.argoproj.io/rbac-rule: "'k8s-dev-admin' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-sa-admin.service-account-token
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    kubernetes.io/service-account.name: argo-workflows-sa-admin
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows-sa-viewer
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    workflows.argoproj.io/rbac-rule: "'k8s-dev-viewer' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-sa-viewer.service-account-token
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    kubernetes.io/service-account.name: argo-workflows-sa-viewer
type: kubernetes.io/service-account-token
---
# The admin tier: the chart's own argo-server role (ClusterRole argo-workflows-server in the
# release), narrowed to the namespace workflows actually run in.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflows-sa-admin
  namespace: workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["configmaps", "events"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["watch", "create", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workfloweventbindings", "workflowtemplates", "cronworkflows"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflows-sa-admin
  namespace: workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: argo-workflows-sa-admin
    namespace: argo-workflows
roleRef:
  kind: Role
  name: argo-workflows-sa-admin
  apiGroup: rbac.authorization.k8s.io
---
# The viewer tier: the same resource surface, read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflows-sa-viewer
  namespace: workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["configmaps", "events", "pods", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workfloweventbindings", "workflowtemplates", "cronworkflows"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflows-sa-viewer
  namespace: workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: argo-workflows-sa-viewer
    namespace: argo-workflows
roleRef:
  kind: Role
  name: argo-workflows-sa-viewer
  apiGroup: rbac.authorization.k8s.io
