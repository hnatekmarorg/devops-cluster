{{- if and .Values.onprem .Values.karpenter.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/sergelogvinov/charts
      chart: karpenter-provider-proxmox
      # Chart 0.4.9 ships provider v0.12.0. The old pin (0.1.0 -> v0.3.0) ships a ClusterRole that
      # cannot list proxmoxtemplates/proxmoxunmanagedtemplates, so the controller crash-loops on
      # reflectors and the NodePool never reconciles ("NodeClassReady=Unknown").
      targetRevision: "0.4.9"
      helm:
        releaseName: karpenter
        valuesObject:
          # TOP LEVEL, not under `settings:`. The chart reads .Values.existingConfigSecret, so nesting it
          # under settings made the release look for a secret named <release>-<chart> that never existed —
          # the pod sat in ContainerCreating on `secret "karpenter-karpenter-provider-proxmox" not found`.
          existingConfigSecret: {{ .Values.karpenter.credentialsSecret }}
          existingConfigSecretKey: config.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
