{{- if and .Values.onprem .Values.karpenter.enabled .Values.karpenter.ccm.enabled }}
# The Proxmox Cloud Controller Manager.
#
# Required, not optional: it is what sets spec.providerID on Nodes. Without it the provider cannot
# correlate a VM with a Node, so NodeClaims never register, Karpenter times out and terminates the
# instance it just built, `karpenter.sh/nodepool` is never applied (pool-targeted pods never schedule),
# and nodes whose VMs are gone linger as NotReady. Its counterpart requirement is on the kubelet side:
# every kubelet must run with --cloud-provider=external (on Talos: patch the KubeletConfig document by
# kind — a JSON patch will not work on a multi-document machine config).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxmox-ccm
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/sergelogvinov/charts
      chart: proxmox-cloud-controller-manager
      # Chart 0.2.30 ships CCM v0.15.0. The old pin (0.2.0 -> CCM v0.4.0) resolved Nodes by VM NAME
      # and nothing else: v0.4.0 has no FindVMByUUID, no providerID-from-node, no annotation path.
      # That is the node-naming problem — Talos names itself talos-xxxx-xxx while the VM is dev-cp1,
      # so providerID is never set, the uninitialized taint is never cleared and nothing schedules.
      # v0.15.0 matches on the SMBIOS UUID, which already matches the VM exactly, so no renaming is
      # needed for either static or Karpenter-provisioned nodes.
      targetRevision: "0.2.30"
      helm:
        releaseName: proxmox-ccm
        valuesObject:
          existingConfigSecret: {{ .Values.karpenter.ccm.existingConfigSecret }}
          existingConfigSecretKey: config.yaml
          enabledControllers:
            - cloud-node
            - cloud-node-lifecycle
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
