{{- if and .Values.onprem .Values.scale.enabled }}
# SCALE's namespace, declared with PSA labels like the inference one (the pods run as root —
# the images carry no USER — and need no host access).
apiVersion: v1
kind: Namespace
metadata:
  name: scale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
{{- end }}
