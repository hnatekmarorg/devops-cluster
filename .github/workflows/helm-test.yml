name: Helm Tests

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Helm Lint
        run: |
          for chart in charts/*/; do
            echo "=== Linting $chart ==="
            helm lint "$chart"
          done

  helm-unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Install helm-unittest
        run: |
          rm -rf ~/.local/share/helm/plugins/helm-unittest.git ~/.local/share/helm/plugins/helm-unittest
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.0.2

      - name: Run helm-unittest
        run: |
          for chart in charts/*/; do
            if [ -d "${chart}tests" ]; then
              echo "=== Running unit tests for $chart ==="
              helm unittest "$chart"
            else
              echo "=== No tests directory in $chart, skipping ==="
            fi
          done

  ct-lint:
    name: Chart Testing (ct lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run ct lint
        run: ct lint --config ct.yaml --all
        # Note: ct install is intentionally omitted because the charts depend on
        # external CRDs (ArgoCD Applications, Crossplane Providers) that are not
        # available in a plain kind cluster. Validation is covered by:
        #   - helm lint (chart syntax)
        #   - helm-unittest (template rendering logic)
        #   - ct lint (chart structure, yamllint, maintainer validation)
