---
# cluster-base for this cluster, as an ArgoCD Application.
#
# This directory is what bootstrap-cluster.sh hands to ArgoCD (the root Application recurses over
# bootstrap/argocd/<cluster>). Everything the cluster needs after the bootstrap is described here or by
# the chart this points at — which is the point: ArgoCD is the boundary, and nothing above it is done
# by hand.
#
# cluster-base renders one Application per component (cert-manager + its Cloudflare credential, ESO +
# the secret store, Karpenter + the CCM, nginx, crossplane, and the RBAC bindings). So this single
# Application is what closes the gap where the bindings had to be applied by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/hnatekmarorg/devops-cluster.git
    targetRevision: HEAD
    path: charts/cluster-base

    helm:
      # THE ONE PER-CLUSTER VALUE. It decides which RBAC bindings this cluster gets:
      #   dev   -> sso:k8s-dev-viewer / sso:k8s-dev-admin
      #   infra -> sso:k8s-infra-viewer / sso:k8s-infra-admin
      # The chart refuses to render without it, deliberately: guessing wrong would grant the wrong
      # tier, so a missing class is a hard failure rather than a default.
      values: |
        clusterClass: dev

        # Cloudflare credential via ESO, NOT sops. The SOPS route exists for the cluster that hosts the
        # reverse proxy — it cannot source its cert-issuing token from the vault it fronts. Every other
        # cluster reads it from the vault, which is also what gives it revocation and audit.
        # ESO is now the chart default; what stays per-cluster is everything below — the auth mount,
        # the store and the role.
        # The chart's keys are certManager.eso.*, NOT eso.* — the store template is gated on
        # certManager.eso.enabled AND certManager.eso.storeServer, so the wrong nesting meant the
        # ClusterSecretStore never rendered at all. Silent: no error, just a component that
        # quietly does not exist.
        #
        # clusterName is required (the vault auth mount is per cluster and the default derives from it).
        clusterName: dev
        # The autoscaling budget, per pool now that pools are values. ALL FIVE families, deliberately:
        # the wide end (m1 1:8, x1 1:16) is what lets one memory-hungry pod be served by ONE node
        # instead of a fleet of small ones. Balteus measures 128 cores / 1008 GiB, and this ceiling is
        # set near the machine rather than to a fraction of it — the trade being that a busy pool competes
        # with the 51 other VMs on the box (the NAS VM alone holds 256 GiB) and Proxmox reserves nothing.
        # The provider does not overcommit memory, so what this buys is "the pool may use what is left",
        # not "the pool may exceed the host".
        karpenter:
          pools:
            - name: talos-nocloud-template
              templateName: talos-nocloud-template
              # Node roots are the NODE tier: the local NVMe. This is the same answer the chart's default
              # now carries (charts/cluster-base/values.yaml) — kept explicit here because this cluster
              # paid for it: the inherited `iscsi` default had nodes booting, stalling containerd on the
              # all-5400rpm `data` pool, and being recycled within minutes, indefinitely (2026-09-23).
              #
              # NOT `ssd-fast`: that is the NAS SSD mirror, and it is the CONTROL-PLANE tier — the CP of
              # this cluster sits on it (terraform/clusters/dev/main.tf), where an etcd WAL needs a quiet
              # device. Parking churn there put the TrueNAS plugin's broker in the clone path, and under a
              # 1000-pod run it answered `no response from upstream`: clones failed, nodes never
              # registered, Karpenter retried, 13 orphans in 7 minutes (2026-09-24).
              bootDevice:
                storage: local-lvm
              instanceFamilies: ["c1", "t1", "s1", "m1", "x1"]
              limits:
                cpu: "128"
                memory: 512Gi
              # The chart default is 1m — SHORTER than a node takes to boot and register, so a slow or
              # failed registration is indistinguishable from an idle node and gets recycled. That is what
              # turned the storage problem above into a loop rather than a one-off. 5m keeps the intent
              # (an idle burst node returns its RAM quickly) without arming a spawn loop.
              disruption:
                consolidateAfter: 5m
        certManager:
          cloudflare:
            secretSource: eso
          eso:
            enabled: true
            storeName: local-dev
            storeServer: https://bao.srv.hnatekmar.dev
            vaultPath: secret              # the KV mount; the KEY below picks common/ vs dev/
            mountPath: kubernetes-dev      # must match what wire-vault.sh enabled
            vaultRole: local-dev

        # This cluster's Keycloak writer — the identity that creates the clients dev's services consume
        # (charts/cluster-base/templates/crossplane/keycloak-writer.yaml carries the reasoning).
        #
        # ON, and the two things it needs are both per-cluster: the credential at
        # `secret/dev/keycloak-writer` (seeded once by hand — the hub cannot reach this site's vault), and
        # the Keycloak client behind it, `crossplane-dev-hnatekmar-xyz` in the hub repo. One writer per
        # object: the hub keeps the realm, the IdPs, the human clients and the role catalog; this cluster
        # declares only the clients it consumes.
        crossplane:
          keycloak:
            enabled: true

        # Service VIPs for this cluster. Without MetalLB the ingress controller's Service sits at
        # EXTERNAL-IP `<pending>` forever and every Ingress is unreachable, whatever cert-manager says
        # about its certificate. 172.16.48.0/24 is this cluster's /24 out of the estate's reserved VIP
        # block, 172.16.48.0/20 — see the range comment in charts/cluster-base/values.yaml.
        metallb:
          enabled: true
          pool:
            addresses:
              - 172.16.48.1-172.16.48.254
          # The first address of the block, so cluster -> VIP stays arithmetic rather than a lookup.
          ingressVIP: 172.16.48.1

        # Storage over the air-gapped 10G island. Both tiers live on the NAS and both address it by the
        # *storage* name (`truenas.storage.hnatekmar.dev` = 192.168.88.25), not the srv one — the
        # appliance answers NFS/iSCSI/NVMe-oF on the management address too, so the wrong name is a 1G
        # data path rather than a failure.
        #
        # PREREQUISITE, and it is a hard ordering: that name resolves only from the router's resolver,
        # and the record lands via PR #126 (`terraform/routeros/dns.tf`) + its `apply · routeros` job.
        # Until that apply runs, the name answers the ingress VIP through the public wildcard, so the
        # NFS mount and the NVMe-oF connect would both fail in a way that looks like a NAS problem.
        storage:
          # RWX: NFS subdirs (`nfs-client`). The NAS path `/mnt/data/k8s/clusters/main` exists and
          # `/mnt/data/k8s` is exported.
          nfs:
            enabled: true
          # RWO block: NVMe-oF/TCP via the official driver, namespace `truenas-csi`, class
          # `truenas-nvmeof` (NOT the cluster default — longhorn keeps that). The API key comes from the
          # vault at `secret/common/truenas-csi` — shared, because the appliance has one key for the
          # driver and every cluster uses that one (the chart default; see values.yaml).
          truenasCsi:
            enabled: true

        # Monitoring: Prometheus + Alertmanager + Grafana, and the alert path to Telegram. The reasoning —
        # including why alerts go to Telegram rather than the estate's own ntfy — is in the block comment
        # on `monitoring` in charts/cluster-base/values.yaml. What is here is what THIS cluster decides.
        #
        # Grafana is SSO-only and logs in with `grafana-dev`, a client THIS cluster creates in the shared
        # master realm (its writer holds manage-clients + view-realm and nothing else). Roles follow the
        # same SSO groups the RBAC bindings above use: k8s-dev-admin -> Admin, k8s-dev-viewer -> Viewer,
        # and anybody the mapping does not name is refused rather than defaulted to Viewer.
        #
        # PREREQUISITES, one of which is done by hand once:
        #   * `secret/common/telegram` in the vault — the bot token (./scripts/seed-vault.sh telegram).
        #     And the bot must already have a chat with the destination, because a bot cannot start one.
        #   * The hostname needs no DNS work: `*.dev-k8s.srv.hnatekmar.dev` is a regexp record on the
        #     router that answers every service name on this cluster with its ingress VIP (172.16.48.1).
        monitoring:
          enabled: true
          # Sized for the node it actually runs on: dev-cp1 is 8 vCPU / 16GiB and carries the control plane
          # AND this stack, so requests stay small on purpose and retention short. Both volumes go on the
          # BLOCK tier — a TSDB on NFS-async is how a WAL gets corrupted, and while Grafana's own state is
          # less sensitive there is no reason to put it on a different plane.
          prometheus:
            retention: 7d
            retentionSize: 12GB
            storageSize: 20Gi
            # A LIMIT here, unusually for this repo, because a Prometheus with no ceiling is the one pod that
            # can take a node down with it — and on this cluster that node is the control plane. 3Gi is a
            # ceiling, not a target.
            #
            # RAISED FROM 1Gi (2026-09-25). The old value reasoned "~3x what a cluster this size actually
            # holds", sized for "two 4-vCPU/8Gi nodes" — but this stack carries ~212k series and at 1Gi
            # Prometheus could not finish WAL replay: OOMKilled (exit 137) ~28s in, at segment ~197/262,
            # 193+ restarts in CrashLoopBackOff, so the Service had NO endpoints. In that state nothing is
            # measured and no alert can fire — worse than the node risk the limit was guarding against, and
            # it is how a missing series gets misread as a missing scrape.
            #
            # Cardinality control is the real fix and needs the headroom this buys to be measured.
            resources:
              limits:
                memory: 3Gi
          grafana:
            storageSize: 2Gi
          alertmanager:
            storageSize: 1Gi
            # THE CHAT THE BOT POSTS INTO. A private chat's id is the user's own numeric id, so this is the
            # same value the estate's other bots already use — and the chart refuses to render without it,
            # because a `chat_id` of 0 (what an empty value would become) is an alert path that syncs
            # cleanly and posts into nothing.
            #
            # For more than one reader, change this to the id of a GROUP the bot is a member of: it carries
            # the `-100...` form, which is why this is a string in the values and converted in the chart.
            telegram:
              chatId: "8640318180"

  destination:
    server: https://kubernetes.default.svc   # in-cluster
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
