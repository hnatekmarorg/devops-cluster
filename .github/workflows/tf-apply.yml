# Device IaC — apply on merge (the only path that writes to a device).
#
# Triggers only when a reviewed PR that changes terraform/** lands on main, and only when the repo
# variable ROUTEROS_CI_ENABLED is 'true' (the arming switch).
#
# ONE JOB PER DEVICE. Not a matrix, because `environment:` cannot take a matrix value — and the
# environment is what scopes that device's write credential. The benefit is a better gate than a
# single switch: approving the router's apply says nothing about the switch's, so one merge can be
# applied to one device and declined for the other.
name: tf-apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-*.yml'
      - '.github/workflows/_apply-module.yml'
      - 'scripts/tofu-ci.sh'
  workflow_dispatch:
    inputs:
      note:
        description: 'Why this apply is being run (recorded in the run summary)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  apply-routeros:
    name: apply · routeros (RB5009)
    uses: ./.github/workflows/_apply-module.yml
    with:
      module: routeros
      host: api://172.16.100.1:8728
      state_key: routeros/rb5009.tfstate
      note: ${{ inputs.note || '' }}
    secrets:
      ROS_WRITE_USERNAME: ${{ secrets.ROS_WRITE_USERNAME }}
      ROS_WRITE_PASSWORD: ${{ secrets.ROS_WRITE_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    # Second gate, independent of the merge: this environment has Martin as a required reviewer, so
    # the job waits for an explicit approval before it starts.
    environment: routeros-production
    # Applies are serialised per device: one writer at a time, ever.
    concurrency:
      group: tf-apply-routeros
      cancel-in-progress: false

  apply-crs326:
    name: apply · crs326 (main switch)
    uses: ./.github/workflows/_apply-module.yml
    with:
      module: crs326
      host: api://172.16.100.2:8728
      state_key: crs326/crs326.tfstate
      note: ${{ inputs.note || '' }}
    secrets:
      ROS_WRITE_USERNAME: ${{ secrets.ROS_WRITE_USERNAME }}
      ROS_WRITE_PASSWORD: ${{ secrets.ROS_WRITE_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    environment: crs326-production
    concurrency:
      group: tf-apply-crs326
      cancel-in-progress: false
