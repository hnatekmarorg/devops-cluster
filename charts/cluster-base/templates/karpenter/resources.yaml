{{- if and .Values.onprem .Values.karpenter.enabled }}
# Which PVE template to clone. Unmanaged ⇒ the provider searches every Proxmox node for this NAME.
apiVersion: karpenter.proxmox.sinextra.dev/v1alpha1
kind: ProxmoxUnmanagedTemplate
metadata:
  name: {{ .Values.karpenter.templateName }}
spec:
  region: {{ .Values.karpenter.region }}
  templateName: {{ .Values.karpenter.templateName }}
---
# Where and how: region, disk (which also selects the zones), and how the machine config is delivered.
apiVersion: karpenter.proxmox.sinextra.dev/v1alpha1
kind: ProxmoxNodeClass
metadata:
  name: {{ .Values.karpenter.templateName }}
spec:
  region: {{ .Values.karpenter.region }}
  instanceTemplateRef:
    kind: ProxmoxUnmanagedTemplate
    name: {{ .Values.karpenter.templateName }}
  bootDevice:
    size: {{ .Values.karpenter.bootDevice.size }}
    storage: {{ .Values.karpenter.bootDevice.storage }}
  metadataOptions:
    type: cdrom                # the v0.12.0 CRD's enum is exactly [none, cdrom]
    # `templatesRef`. The field name is VERSION-DEPENDENT, which is why it has now been wrong in both
    # directions: provider v0.3.0 declared `secretRef`, and provider v0.12.0 declares
    # {templatesRef, valuesRef, type} — dropping `secretRef` entirely. The earlier correction to
    # `secretRef` was right for the CRD installed at the time and became wrong the moment this chart was
    # bumped to v0.12.0. So treat the CRD as the source of truth, and re-read it after every bump:
    #
    #   kubectl get crd proxmoxnodeclasses.karpenter.proxmox.sinextra.dev -o json \
    #     | jq '.spec.versions[]|select(.served).schema.openAPIV3Schema.properties.spec.properties.metadataOptions.properties|keys'
    #
    # The referenced Secret carries cloud-init fragments as keys, all optional:
    #   user-data, meta-data, network-config
    # NOTE: that Secret does not exist yet — this fixes the field, not the secret.
    templatesRef:
      name: {{ .Values.karpenter.joinSecret.name }}
      namespace: {{ .Values.karpenter.joinSecret.namespace }}
  placementStrategy:
    zoneBalance: Balanced
  tags:
    - karpenter
---
# What may be provisioned. No family requirement ⇒ Karpenter sizes each node to fit the pending pods,
# which is what you want on-prem: no over-provisioning.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.karpenter.templateName }}
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.proxmox.sinextra.dev
        kind: ProxmoxNodeClass
        name: {{ .Values.karpenter.templateName }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.proxmox.sinextra.dev/instance-family
          operator: In
          values: {{ .Values.karpenter.instanceFamilies | toJson }}
      expireAfter: Never
  limits:
    cpu: {{ .Values.karpenter.limits.cpu | quote }}
    memory: {{ .Values.karpenter.limits.memory }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
{{- end }}
