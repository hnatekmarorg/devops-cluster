{{/*
The RWX tier: per-PVC subdirectories on the NAS, over NFS.

Off by default, and now for a narrower reason than before: the cluster's class has to reach the storage
LAN. dev does — its nodes carry a second NIC on the air-gapped island (vmbr2, MTU 9000, addresses from
the island's own DHCP) and reach the appliance as `truenas.storage.hnatekmar.dev`.

The server is that *storage* name rather than the srv one deliberately. The appliance answers NFS on the
1G management address as well, so `truenas.srv…` would mount successfully over the wrong plane — exactly
the failure this name exists to prevent. Reachability is what the class has to provide, not the protocol.
*/}}
{{- if and .Values.onprem .Values.storage.nfs.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-async
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - chart: nfs-subdir-external-provisioner
      repoURL: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
      targetRevision: 4.0.18
      helm:
        releaseName: nfs-subdir-external-provisioner
        valuesObject:
          volume-name: nfs-async
          storageClass:
            name: nfs-client
            pathPattern: "${.PVC.annotations.nfs.io/storage-path}"
            onDelete: delete
          nfs:
            server: {{ .Values.storage.nfs.server | quote }}
            mountOptions:
              - hard
              - intr
              - async
              - proto=tcp
              - noacl
              - nfsvers=4.2
              - noatime
            path: {{ .Values.storage.nfs.path | quote }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
{{end}}