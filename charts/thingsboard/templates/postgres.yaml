apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-postgres"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thingsboard-postgres
    app.kubernetes.io/part-of: thingsboard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thingsboard-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thingsboard-postgres
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: thingsboard
            - name: POSTGRES_USER
              value: thingsboard
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: password
          ports:
            - containerPort: 5432
              name: pg
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          # EPHEMERAL by design - data is wiped on reschedule. Swap emptyDir
          # for a longhorn PVC to make it persistent.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-postgres"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thingsboard-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: thingsboard-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
