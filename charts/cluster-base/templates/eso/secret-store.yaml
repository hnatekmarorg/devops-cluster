{{- if and .Values.certManager.eso.enabled .Values.certManager.eso.storeServer }}
# The vault in THIS cluster's site. `kubernetes` auth means the vault calls TokenReview on this
# cluster's API server, so vault and cluster have to be in the same site — a vault across a WAN turns
# that into an inbound path into the LAN.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.certManager.eso.storeName }}
spec:
  provider:
    vault:
      server: {{ .Values.certManager.eso.storeServer }}
      path: {{ .Values.certManager.eso.vaultPath }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
          {{- if .Values.certManager.eso.vaultRole }}
          role: {{ .Values.certManager.eso.vaultRole }}
          {{- end }}
{{- end }}
